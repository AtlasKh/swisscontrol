/* ===================== УТИЛИТЫ ===================== */

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const pad = n => String(n).padStart(2, '0');
const isoDate = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const fmtDT = iso => new Date(iso).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
const fmtNum = (n, d = 2) => (Math.round(n * Math.pow(10, d)) / Math.pow(10, d)).toString().replace('.', ',');

/* ===================== ПОДКЛЮЧЕНИЕ К БАЗЕ (Supabase) =====================
   Вставьте сюда два значения из Supabase (Project URL и publishable key).

   данные хранятся только на этом телефоне. */
const SUPABASE_URL = 'https://rxjvsjpigsryxjrbfujr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_F0JlRlRMDnho42UH18YO5g_bEwxOpgS';
const CLOUD = !!(SUPABASE_URL && SUPABASE_KEY);

/* ===================== ЛОКАЛЬНЫЙ КЭШ =====================
   В облачном режиме тут лежит только копия данных (без чертежей),
   главная база находится в Supabase (см. блок «ОБЛАКО» ниже). */
const KEY = 'swisscontrol_v1';
const Store = {
  load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } },
  save(data) {
    try { localStorage.setItem(KEY, JSON.stringify(data, CLOUD ? (k, v) => (k === 'drawing' ? undefined : v) : undefined)); }
    catch (e) { alert('Не хватает памяти для сохранения. Удалите чертёж или уменьшите изображения.'); }
  }
};

function newMachine(num_, model) {
  return {
    id: uid(), num: num_, model: model || '',
    part: { name: '', len: 0, qty: 0 },
    bar: { dia: 0 },
    collets: { main: '', back: '' },
    cutW: 3, cycle: 0, eff: 85,
    barCfg: { face: 0.5, barLen: 3, remnant: 300 },
    tools: [], changes: [],
    program: { name: '', notes: '', code: '' },
    drawing: null,
    shifts: {}
  };
}

function seedData() {
  const m = newMachine('01', 'Citizen L20');
  m.part = { name: 'Вал-шестерня', len: 23.8, qty: 1500 };
  m.bar.dia = 18;
  m.collets = { main: '18М', back: '14B' };
  m.tools = [
    { id: uid(), code: 'T01', name: 'Проходной резец', spec: 'Пластина ромб CCGT' },
    { id: uid(), code: 'T02', name: 'Отрезной резец', spec: 'Ширина 3.0 мм' },
    { id: uid(), code: 'T03', name: 'Сверло монолит', spec: 'Ø 5.5 мм (Main)' }
  ];
  return { machines: [m] };
}

/* db.staff = [{id, name}] — сотрудники графика (порядок = порядок в списке)
   db.roster = { 'ГГГГ-ММ-ДД': { idСотрудника: 'd' | 'n' } } — нет записи = выходной */
function normDb(d) { d = d || {}; d.machines = d.machines || []; d.staff = d.staff || []; d.roster = d.roster || {}; d.att = d.att || {}; d.batches = d.batches || {}; d.users = d.users || {}; return d; }
let db = normDb(Store.load() || seedData());
/* ===================== ОБЛАКО (Supabase) =====================
   Как это работает: весь остальной код по-прежнему меняет объект db и
   вызывает save(). Слой ниже сам сравнивает db с тем, что уже лежит на
   сервере, и отправляет только изменившиеся строки. Каждые 12 секунд
   (и при возврате в приложение) подтягиваются изменения других людей. */
const Sync = { enabled: CLOUD, ready: false, busy: false, again: false, dirty: false, queued: false,
  online: true, error: null, snap: { m: {}, e: {}, c: {}, s: {}, r: {}, a: {}, b: {}, u: {} }, loading: {}, t: null, started: false,
  noRoster: false,     // noRoster = в базе ещё нет таблиц графика (не выполнен setup2.sql)
  noAtt: false,        // noAtt = в базе ещё нет таблицы явки (не выполнен setup3.sql)
  noV4: false };       // noV4 = нет архива партий и пользователей (не выполнен setup4.sql)
const SYNC_KEYS = ['m', 'e', 'c', 's', 'r', 'a', 'b', 'u'];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const SAFE_ID = /^[A-Za-z0-9_-]+$/;

async function rest(path, opts = {}) {
  const h = Object.assign({ apikey: SUPABASE_KEY, 'Content-Type': 'application/json' }, opts.headers || {});
  if (SUPABASE_KEY.startsWith('eyJ')) h.Authorization = 'Bearer ' + SUPABASE_KEY; // старый (legacy) ключ
  const r = await fetch(SUPABASE_URL.replace(/\/+$/, '') + '/rest/v1/' + path, {
    method: opts.method || 'GET', headers: h, body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  const text = await r.text();
  if (!r.ok) throw new Error(r.status + ' ' + text.slice(0, 200));
  return text ? JSON.parse(text) : null;
}
async function restAll(path) {            // сервер отдаёт максимум 1000 строк за раз
  const out = [], sep = path.includes('?') ? '&' : '?';
  for (let off = 0; ; off += 1000) {
    const part = await rest(path + sep + 'limit=1000&offset=' + off);
    for (const row of part) out.push(row);
    if (part.length < 1000) break;
  }
  return out;
}

/* db -> строки таблиц */
function toRows(d) {
  const rows = { m: {}, e: {}, c: {}, s: {}, r: {}, a: {}, b: {}, u: {} };
  const v4 = !Sync.noV4;                           // архив партий, пользователи и batch_id есть в базе
  if (v4) {
    for (const b of Object.values(d.batches || {})) rows.b[b.id] = { id: b.id, machine_id: b.machine_id, data: b.data, finished_at: b.finished_at };
    for (const u of Object.values(d.users || {})) rows.u[u.id] = { id: u.id, tg_id: u.tg_id, name: u.name, role: u.role, want: u.want || null, created_at: u.created_at };
  }
  const withAtt = !Sync.noAtt;                     // колонка tg_id и таблица явки есть в базе
  (d.staff || []).forEach((p, i) => {
    rows.s[p.id] = { id: p.id, name: p.name, sort: i };
    if (withAtt) rows.s[p.id].tg_id = p.tg_id || null;
  });
  if (withAtt) for (const a of Object.values(d.att || {}))
    rows.a[a.id] = { id: a.id, staff_id: a.staff_id, day: a.day, shift: a.shift, in_ts: a.in_ts, out_ts: a.out_ts || null, by_admin: !!a.by_admin };
  for (const [day, map] of Object.entries(d.roster || {}))
    for (const [sid, sh] of Object.entries(map)) { const id = day + '_' + sid; rows.r[id] = { id, staff_id: sid, day, shift: sh }; }
  for (const m of d.machines) {
    const { drawing, shifts, changes, ...data } = m;
    data.hasDrawing = !!(drawing || m.hasDrawing);
    rows.m[m.id] = { id: m.id, data };
    for (const [day, arr] of Object.entries(m.shifts || {})) for (const e of arr)
    {
      rows.e[e.id] = { id: e.id, machine_id: m.id, day, shift: shiftOf(e), who: e.who || '—', count: Math.round(num(e.count)) };
      if (v4) rows.e[e.id].batch_id = e.batch || null;
    }
    for (const c of (m.changes || []))
      rows.c[c.id] = { id: c.id, machine_id: m.id, ts: c.ts, who: c.who || null, code: c.code || null, tool: c.tool || null, reason: c.reason || null, spec: c.spec || null, comment: c.comment || null };
  }
  return rows;
}
function serialize(rows) {
  const s = { m: {}, e: {}, c: {}, s: {}, r: {}, a: {}, b: {}, u: {} };
  for (const k of SYNC_KEYS) for (const id in rows[k]) s[k][id] = JSON.stringify(rows[k][id]);
  return s;
}

function setOnline(ok, msg) {
  const changed = Sync.online !== ok;
  Sync.online = ok; Sync.error = ok ? null : msg;
  const a = document.activeElement;
  if (changed && Sync.ready && !document.querySelector('.modal-bg') && !(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName))) rerender();
}

/* отправка изменений на сервер */
async function syncPush() {
  if (!Sync.enabled || !Sync.ready) return;
  Sync.queued = false;
  if (Sync.busy) { Sync.again = true; return; }
  Sync.busy = true;
  try {
    do {
      Sync.again = false;
      const rows = toRows(db), ser = serialize(rows);
      const changed = k => Object.keys(rows[k]).filter(id => (Sync.snap[k] || {})[id] !== ser[k][id]).map(id => rows[k][id]);
      const removed = k => Object.keys(Sync.snap[k] || {}).filter(id => !(id in rows[k]) && SAFE_ID.test(id));
      const up = (table, arr) => rest(table + '?on_conflict=id', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: arr });
      const del = async (table, ids) => {                    // частями, чтобы адрес запроса не был слишком длинным
        for (let i = 0; i < ids.length; i += 100) await rest(table + '?id=in.(' + ids.slice(i, i + 100).join(',') + ')', { method: 'DELETE' });
      };
      const R = !Sync.noRoster;                               // таблицы графика есть в базе
      const cm = changed('m'), ce = changed('e'), cc = changed('c');
      const cs = R ? changed('s') : [], cr = R ? changed('r') : [];
      if (cm.length) await up('machines', cm);              // станки и люди раньше записей (связь по ключу)
      const V = !Sync.noV4;
      const cb = V ? changed('b') : [], cu = V ? changed('u') : [];
      if (cb.length) await up('batches', cb);
      if (cu.length) await up('users', cu);
      const db_ = V ? removed('b') : [], du = V ? removed('u') : [];
      if (db_.length) await del('batches', db_);
      if (du.length) await del('users', du);
      if (cs.length) await up('staff', cs);
      if (ce.length) await up('shift_entries', ce);
      if (cc.length) await up('tool_changes', cc);
      if (cr.length) await up('roster', cr);
      const A = R && !Sync.noAtt;                             // таблица явки есть в базе
      const ca = A ? changed('a') : [];
      if (ca.length) await up('attendance', ca);
      const de = removed('e'), dm = removed('m'), dc = removed('c');
      const dr = R ? removed('r') : [], ds = R ? removed('s') : [], da = A ? removed('a') : [];
      if (de.length) await del('shift_entries', de);
      if (dc.length) await del('tool_changes', dc);
      if (dr.length) await del('roster', dr);
      if (da.length) await del('attendance', da);
      if (ds.length) await del('staff', ds);
      if (dm.length) await del('machines', dm);
      Sync.snap = ser;
    } while (Sync.again);
    Sync.dirty = Sync.queued;
    setOnline(true);
  } catch (e) {
    Sync.dirty = true;
    setOnline(false, e.message);
    clearTimeout(Sync.t); Sync.t = setTimeout(syncPush, 8000);   // повторим позже
  }
  Sync.busy = false;
}
async function flushNow() {
  clearTimeout(Sync.t);
  while (Sync.busy) await sleep(100);
  await syncPush();
}

function save() {
  Store.save(db);
  if (Sync.enabled && Sync.ready) {
    Sync.dirty = true; Sync.queued = true;
    clearTimeout(Sync.t); Sync.t = setTimeout(syncPush, 300);
  }
}

/* получение данных с сервера. Возвращает true, если что-то изменилось */
async function syncPull(first) {
  const flags0 = [Sync.noRoster, Sync.noAtt, Sync.noV4].join();   // смена состояния базы (выполнен SQL) — тоже повод перерисовать
  const [ms, es, cs] = await Promise.all([
    restAll('machines?select=id,data&order=id'),
    restAll('shift_entries?select=*&order=id'),
    restAll('tool_changes?select=*&order=id')
  ]);
  let ss = [], rs = [];
  try {                                            // таблицы графика (появляются после setup2.sql)
    [ss, rs] = await Promise.all([
      restAll('staff?select=*&order=sort'),
      restAll('roster?select=id,staff_id,day,shift&order=id')
    ]);
    Sync.noRoster = false;
  } catch (e) {
    if (/PGRST2|42P01|does not exist|schema cache|^404/.test(e.message)) Sync.noRoster = true;
    else throw e;
  }
  let bs = [], us = [];
  try {                                            // архив партий и пользователи (появляются после setup4.sql)
    [bs, us] = await Promise.all([
      restAll('batches?select=id,machine_id,data,finished_at&order=id'),
      restAll('users?select=*&order=id')
    ]);
    Sync.noV4 = false;
  } catch (e) {
    if (/PGRST2|42P01|does not exist|schema cache|^404/.test(e.message)) Sync.noV4 = true;
    else throw e;
  }
  let as = [];
  if (!Sync.noRoster) {
    try {                                          // таблица явки (появляется после setup3.sql)
      as = await restAll('attendance?select=*&order=id');
      Sync.noAtt = false;
    } catch (e) {
      if (/PGRST2|42P01|does not exist|schema cache|^404/.test(e.message)) Sync.noAtt = true;
      else throw e;
    }
  } else Sync.noAtt = true;
  if (!ms.length && !ss.length && first) {         // сервер пуст: первый админ загружает то, что есть на телефоне
    if (can('setup')) {
      Sync.ready = true;
      for (const m of db.machines) if (m.drawing) { m.hasDrawing = true; m.drawingV = m.drawingV || Date.now(); }
      await syncPush();
      if (!Sync.online) throw new Error(Sync.error || 'не удалось загрузить данные');
      for (const m of db.machines) if (m.drawing) await Sync.putDrawing(m.id, m.drawing);
      return true;
    }
    db = normDb({}); Store.save(db); Sync.snap = serialize(toRows(db));
    return true;
  }
  if (Sync.dirty || Sync.busy || Sync.queued) return false;   // у нас есть неотправленные правки — не затираем
  const flagsChanged = flags0 !== [Sync.noRoster, Sync.noAtt, Sync.noV4].join();
  const old = {};
  db.machines.forEach(m => { old[m.id] = m; });
  const byId = {};
  const machines = ms.map(r => {
    const m = Object.assign(newMachine('', ''), r.data, { id: r.id });
    m.shifts = {}; m.changes = []; m.drawing = null;
    const o = old[r.id];
    if (o && o.drawing && m.hasDrawing && o.drawingV === m.drawingV) m.drawing = o.drawing;   // чертёж не менялся
    else delete Sync.loading[r.id];
    byId[r.id] = m; return m;
  });
  for (const e of es) {
    const m = byId[e.machine_id]; if (!m) continue;
    (m.shifts[e.day] = m.shifts[e.day] || []).push({ id: e.id, who: e.who, shift: e.shift, count: e.count, batch: e.batch_id || null });
  }
  for (const c of cs) {
    const m = byId[c.machine_id];
    if (m) m.changes.push({ id: c.id, ts: c.ts, who: c.who, code: c.code, tool: c.tool, reason: c.reason, spec: c.spec, comment: c.comment });
  }
  machines.forEach(m => m.changes.sort((a, b) => new Date(a.ts) - new Date(b.ts)));
  machines.sort((a, b) => String(a.num).localeCompare(String(b.num), 'ru', { numeric: true }));
  const strip = (k, v) => (k === 'drawing' ? undefined : v);
  const before = JSON.stringify(db, strip);
  let staff = db.staff, roster = db.roster, att = db.att, batches = db.batches, users = db.users;
  if (!Sync.noV4) {
    batches = {}; users = {};
    for (const b of bs) batches[b.id] = { id: b.id, machine_id: b.machine_id, data: b.data || {}, finished_at: b.finished_at };
    for (const u of us) users[u.id] = { id: u.id, tg_id: u.tg_id, name: u.name, role: u.role, want: u.want || null, created_at: u.created_at };
  }
  if (!Sync.noAtt) {
    att = {};
    for (const a of as) att[a.id] = { id: a.id, staff_id: a.staff_id, day: a.day, shift: a.shift, in_ts: a.in_ts, out_ts: a.out_ts || null, by_admin: !!a.by_admin };
  }
  if (!Sync.noRoster) {
    staff = ss.slice().sort((a, b) => a.sort - b.sort).map(r => (r.tg_id != null ? { id: r.id, name: r.name, tg_id: r.tg_id } : { id: r.id, name: r.name }));
    roster = {};
    for (const r of rs) (roster[r.day] = roster[r.day] || {})[r.staff_id] = r.shift;
  }
  db = { machines, staff, roster, att, batches, users };
  const after = JSON.stringify(db, strip);
  Sync.snap = serialize(toRows(db));
  Store.save(db);
  if (ui.mid && !machines.find(m => m.id === ui.mid)) { ui.mid = null; ui.view = 'list'; }
  return before !== after || flagsChanged;
}

async function syncTick(force) {
  if (!Sync.enabled || !Sync.ready || Sync.busy || Sync.dirty || Sync.queued) return;
  const a = document.activeElement;
  if (!force && (document.querySelector('.modal-bg') || (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)))) return;
  try {
    const changed = await syncPull(false);
    setOnline(true);
    if (changed && !document.querySelector('.modal-bg')) rerender();
  } catch (e) { setOnline(false, e.message); }
}

Sync.boot = async function () {
  try {
    await syncPull(true);
    Sync.ready = true; Sync.error = null; Sync.online = true;
    render();
    if (!Sync.started) {
      Sync.started = true;
      setInterval(() => syncTick(), 12000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) syncTick(true); });
      window.addEventListener('focus', () => syncTick(true));
    }
  } catch (e) { Sync.ready = false; Sync.error = e.message; render(); }
};

/* чертежи хранятся отдельно (они тяжёлые) и подгружаются при открытии */
Sync.putDrawing = async function (id, image) {
  if (!Sync.enabled) return;
  try {
    await flushNow();
    await rest('drawings?on_conflict=machine_id', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: [{ machine_id: id, image }] });
  } catch (e) { alert('Не удалось сохранить чертёж на сервере: ' + e.message); }
};
Sync.delDrawing = async function (id) {
  if (!Sync.enabled || !SAFE_ID.test(id)) return;
  try { await flushNow(); await rest('drawings?machine_id=eq.' + id, { method: 'DELETE' }); } catch (e) { setOnline(false, e.message); }
};
Sync.loadDrawing = async function (id) {
  if (Sync.loading[id] || !SAFE_ID.test(id)) return;
  Sync.loading[id] = true;
  try {
    const r = await rest('drawings?machine_id=eq.' + id + '&select=image');
    const m = db.machines.find(x => x.id === id);
    if (m && r && r[0]) { m.drawing = r[0].image; if (ui.view === 'drawing' && ui.mid === id) rerender(); }
  } catch (e) { delete Sync.loading[id]; }
};

function gateView() {
  if (!Sync.enabled || Sync.ready) return null;
  if (Sync.error) return header('SwissControl', 'Нет связи с сервером', false) +
    `<div class="ui-card"><div class="card-title">⚠️ Не удалось загрузить данные</div>
      <div class="muted">Проверьте интернет и попробуйте ещё раз.</div>
      <div class="muted mt" style="word-break:break-all">${esc(Sync.error)}</div>
      <button class="action-button mt" data-act="syncRetry">Повторить</button></div>`;
  return header('SwissControl', 'Загрузка данных…', false) +
    '<div class="ui-card"><div class="empty">⏳ Загружаем данные с сервера…</div></div>';
}
/* Версия приложения. При КАЖДОМ обновлении файла меняйте номер и дату здесь:
   по ним видно, что у сотрудника открылась новая версия. */
const APP_VERSION = '1.14';
const APP_DATE = '06.11.2026';
const footerHtml = () => `<div class="app-version">SwissControl · v${APP_VERSION} · ${APP_DATE}</div>`;
const viewHtml = () => tabHtml() + footerHtml() + navHtml();

/* ===================== ПОЛЬЗОВАТЕЛЬ ===================== */
function getUser() {
  const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (u) return [u.first_name, u.last_name].filter(Boolean).join(' ');
  return localStorage.getItem('sc_user') || '';
}
let user = getUser();

/* ===================== РОЛИ И ДОСТУП =====================
   admin    — владелец (только ADMIN_IDS): всё + приём заявок и роли пользователей
   setter   — наладчик: наладка станков, инструмент, программа, чертежи, архив, график, явка
   operator — оператор: смотрит, вносит свою выработку и замены инструмента, отмечается по QR
   manager  — руководство: станки (параметры, счётчики, пруток, прогноз), график и явка; без резьб/допусков
   qc       — ОТК: параметры деталей, чертежи, история, резьбы, допуски — только просмотр
   При первом входе человек подаёт заявку, админ принимает её и назначает роль.
   ВАЖНО: проверка прав работает в интерфейсе. Для настоящей защиты права нужно
   проверять на сервере по подписи Telegram (initData) — следующий этап. */
const ADMIN_IDS = [381731875];   // полный доступ — только владелец
const tgId = () => { const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user; return u ? u.id : null; };
const isOwner = () => tgId() !== null && ADMIN_IDS.includes(tgId());
const ROLES = {
  admin: { label: 'Админ', ico: '🔑' }, setter: { label: 'Наладчик', ico: '🔧' }, operator: { label: 'Оператор', ico: '👷' },
  manager: { label: 'Руководство', ico: '📊' }, qc: { label: 'ОТК', ico: '🔍' }
};
const ROLE_CHOICES = ['setter', 'operator', 'manager', 'qc'];
const PERMS = {
  setter: ['setup', 'produce', 'editOthers', 'sched', 'attView', 'attEdit', 'checkin', 'tab:machines', 'tab:schedule', 'tab:tol', 'tab:threads'],
  operator: ['produce', 'checkin', 'tab:machines', 'tab:schedule', 'tab:tol', 'tab:threads'],
  manager: ['attView', 'tab:machines', 'tab:schedule'],
  qc: ['tab:machines', 'tab:tol', 'tab:threads']
};
// какие разделы станка видит роль
const MACHINE_MENU = {
  manager: ['calendar', 'bar', 'history', 'drawing'],
  qc: ['drawing', 'history', 'program']
};
const usersOn = () => Sync.enabled && Sync.ready && !Sync.noV4;     // система заявок включена
const myAccount = () => { const id = tgId(); return id == null ? null : db.users[String(id)] || null; };
function myRole() {
  if (isOwner()) return 'admin';
  if (!usersOn()) return 'operator';                               // без базы пользователей — как раньше
  const a = myAccount();
  return a && PERMS[a.role] ? a.role : null;                       // null — нет доступа (нет заявки / ждёт / заблокирован)
}
const can = p => { const r = myRole(); return r === 'admin' || (!!r && PERMS[r].includes(p)); };
const menuVisible = key => { const r = myRole(); return !MACHINE_MENU[r] || MACHINE_MENU[r].includes(key); };
const ACTION_PERM = {};
const needPerm = (perm, acts) => acts.forEach(a => { ACTION_PERM[a] = perm; });

/* ===================== СОСТОЯНИЕ UI ===================== */
const ui = { view: 'list', mid: null, month: new Date(), day: null };
const curM = () => db.machines.find(m => m.id === ui.mid);
/* Партия: записи выработки помечены партией (e.batch). Счётчик станка — только текущая партия (m.batchId).
   Старые записи без пометки относятся к первой партии (m.batchId пустой). */
const inBatch = (m, e) => (e.batch || null) === (m.batchId || null);
const doneOf = m => Object.values(m.shifts).reduce((s, arr) => s + arr.reduce((a, e) => a + (inBatch(m, e) ? num(e.count) : 0), 0), 0);
/* Смены: день 06:00–18:00, ночь 18:00–06:00.
   Ночная смена записывается на дату, когда она НАЧАЛАСЬ
   (в 03:00 30-го числа идёт ночь от 29-го). */
const SHIFT_NAMES = { day: '☀️ День', night: '🌙 Ночь' };
const DAY_START = 6, NIGHT_START = 18, SHIFT_HOURS = 12;
const hh = h => String(h).padStart(2, '0') + ':00';
function currentShift() {
  const now = new Date(), h = now.getHours();
  const d = new Date(now);
  let type = 'day';
  if (h >= NIGHT_START) type = 'night';
  else if (h < DAY_START) { type = 'night'; d.setDate(d.getDate() - 1); }
  return { date: isoDate(d), type };
}
const shiftOf = e => e.shift === 'night' ? 'night' : 'day'; // старые записи = день
const todayEntry = (m, create) => {
  const cs = currentShift();
  const arr = m.shifts[cs.date] || (create ? (m.shifts[cs.date] = []) : []);
  let e = arr.find(x => x.who === user && shiftOf(x) === cs.type && inBatch(m, x));
  if (!e && create) { e = { id: uid(), who: user, shift: cs.type, count: 0, batch: m.batchId || null }; arr.push(e); }
  return e;
};

/* ===================== МОДАЛЬНОЕ ОКНО ===================== */
function modal(title, fields, onSave, onDelete, init) {
  const w = document.createElement('div');
  w.className = 'modal-bg';
  const fieldHtml = f => {
    const v = f.value == null ? '' : f.value;
    let input;
    if (f.type === 'select') input = `<select name="${f.k}">${f.options.map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    else if (f.type === 'textarea') input = `<textarea name="${f.k}" rows="${f.rows || 4}">${esc(v)}</textarea>`;
    else {
      const isNum = f.type === 'number', zero = isNum && String(v).trim() !== '' && num(v) === 0;   // 0 не подставляем — показываем подсказкой
      input = `<input name="${f.k}" type="text" ${isNum ? 'inputmode="decimal"' : ''} value="${zero ? '' : esc(v)}" placeholder="${esc(f.ph || (isNum ? '0' : ''))}">`;
    }
    return `<div class="input-group"><label>${esc(f.label)}</label>${input}</div>`;
  };
  w.innerHTML = `<div class="modal"><h3>${esc(title)}</h3>${fields.map(fieldHtml).join('')}
    <div class="row"><button class="action-button secondary" data-m="x">Отмена</button><button class="action-button" data-m="ok">Сохранить</button></div>
    ${onDelete ? '<button class="action-button secondary mt" style="color:#C0392B" data-m="del">Удалить</button>' : ''}</div>`;
  w.addEventListener('click', e => {
    const b = e.target.closest('[data-m]');
    if (e.target === w || (b && b.dataset.m === 'x')) return w.remove();
    if (!b) return;
    if (b.dataset.m === 'del') { if (confirm('Удалить?')) { onDelete(); w.remove(); } return; }
    if (b.dataset.m === 'ok') {
      const out = {};
      fields.forEach(f => { out[f.k] = w.querySelector(`[name="${f.k}"]`).value.trim(); });
      if (onSave(out) !== false) w.remove();
    }
  });
  // числовое поле при касании выделяется целиком — новое значение заменяет старое, а не дописывается к нему
  w.addEventListener('focusin', e => {
    const el = e.target;
    if (el.matches && el.matches('input[inputmode="decimal"]')) setTimeout(() => { try { el.setSelectionRange(0, el.value.length); } catch (er) {} }, 0);
  });
  document.body.appendChild(w);
  if (init) init(w);
  const touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  const first = w.querySelector('input,textarea');
  if (first && !touch) first.focus();                               // сразу, без задержки (иначе фокус мог «перепрыгнуть» во время ввода); на телефоне автофокус сбивает курсор iOS
}
document.addEventListener('focusin', e => {
  const el = e.target;
  if (el.matches && el.matches('#app input[inputmode="decimal"], #app input[inputmode="numeric"]') && !el.closest('.modal'))
    setTimeout(() => { try { el.setSelectionRange(0, el.value.length); } catch (er) {} }, 0);
});
/* цанга Main по умолчанию = Ø прутка (пока её не изменили вручную) */
function autoCollet(w) {
  const dia = w.querySelector('[name="dia"]'), cm = w.querySelector('[name="cm"]');
  if (!dia || !cm) return;
  let auto = cm.value.trim() === '' || cm.value.trim() === fP(num(dia.value));
  dia.addEventListener('input', () => { if (auto) cm.value = num(dia.value) > 0 ? fP(num(dia.value)) : ''; });
  cm.addEventListener('input', () => { auto = cm.value.trim() === ''; });
}

/* ===================== ПРОГНОЗ ПО ПАРТИИ =====================
   Теория: из времени цикла и загрузки станка считаем производительность.
   Факт: среднее по уже внесённым записям смен (текущая, ещё не закрытая смена не учитывается). */
const fmtDur = hours => {
  if (!isFinite(hours)) return '—';
  const totalH = Math.max(0, Math.round(hours));
  const d = Math.floor(totalH / 24), h = totalH % 24;
  return (d ? d + ' дн ' : '') + h + ' ч';
};
/* Фактическая выработка за смену по записям календаря смен этого станка.
   Текущая (ещё не закрытая) смена не учитывается.
   max — лучшая смена (сколько реально можно сделать за полную смену),
   avg — среднее по всем внесённым сменам, включая неполные (наладка и т.п.). */
function factPerShift(m) {
  const cs = currentShift(), groups = {};
  for (const [day, arr] of Object.entries(m.shifts || {})) for (const e of arr) {
    if (!inBatch(m, e)) continue;                  // только текущая партия
    const type = shiftOf(e), k = day + '|' + type;
    if (k === cs.date + '|' + cs.type) continue;
    (groups[k] = groups[k] || { day, type, v: 0 }).v += num(e.count);
  }
  const all = Object.values(groups).filter(g => g.v > 0);
  if (!all.length) return null;
  const best = all.reduce((a, g) => (g.v > a.v ? g : a));
  return { max: best.v, best, avg: all.reduce((a, g) => a + g.v, 0) / all.length, n: all.length };
}
const shiftLbl = g => (g.type === 'night' ? '🌙 ночь ' : '☀️ день ') + g.day.slice(8) + '.' + g.day.slice(5, 7);
function forecastHtml(m) {
  const qty = num(m.part.qty), left = Math.max(0, qty - doneOf(m));
  const cyc = num(m.cycle), eff = Math.min(100, Math.max(1, num(m.eff) || 85)) / 100;
  const head = '<div class="section-title">⏱ Прогноз по партии</div>';
  if (!(cyc > 0)) return `<div class="ui-card">${head}<div class="muted">${can('setup')
    ? 'Укажите «Время цикла на 1 деталь» в «Наладке станка», и здесь появится расчёт смен и срока окончания.'
    : 'Время цикла пока не задано наладчиком.'}</div></div>`;
  const perHour = 3600 / cyc * eff, perShift = perHour * SHIFT_HOURS;
  const fact = factPerShift(m);
  const line = (a, b) => `<div class="result-line"><span>${a}</span><b>${b}</b></div>`;
  let main;
  if (qty > 0 && left === 0) main = '<div class="result-big">✅ Партия выполнена</div>';
  else if (qty <= 0) main = '<div class="muted">Укажите размер партии в «Наладке станка».</div>';
  else {
    const hours = left / perHour;
    const finish = new Date(Date.now() + hours * 3600 * 1000);
    main = `<div class="muted">До конца партии (осталось ${fmtNum(left, 0)} шт)</div>
      <div class="result-big">≈ ${fmtDur(hours)}</div>
      ${line('Это смен по ' + SHIFT_HOURS + ' ч', '≈ ' + fmtNum(hours / SHIFT_HOURS, 1))}
      ${line('Окончание примерно', fmtDT(finish.toISOString()))}`;
    if (fact) {
      main += line('По максимуму (' + fmtNum(fact.max, 0) + ' шт/смену)', '≈ ' + fmtDur(left / (fact.max / SHIFT_HOURS)));
      if (fact.n > 1 && Math.round(fact.avg) !== fact.max)
        main += line('По среднему (' + fmtNum(fact.avg, 0) + ' шт/смену)', '≈ ' + fmtDur(left / (fact.avg / SHIFT_HOURS)));
    }
  }
  return `<div class="ui-card">${head}<div class="result-box" style="margin-top:0">${main}
    <div style="border-top:1px solid #F2CDAE;margin:8px 0 4px"></div>
    ${line('Цикл на деталь', fmtNum(cyc) + ' сек · загрузка ' + fmtNum(eff * 100, 0) + '%')}
    ${line('Деталей в час', '≈ ' + fmtNum(perHour, 0))}
    ${line('☀️ День (' + hh(DAY_START) + '–' + hh(NIGHT_START) + ')', '≈ ' + fmtNum(perShift, 0) + ' шт')}
    ${line('🌙 Ночь (' + hh(NIGHT_START) + '–' + hh(DAY_START) + ')', '≈ ' + fmtNum(perShift, 0) + ' шт')}
    ${line('За сутки', '≈ ' + fmtNum(perShift * 2, 0) + ' шт')}
    ${fact ? line('Факт: максимум за смену', fmtNum(fact.max, 0) + ' шт') : ''}
    ${fact ? `<div class="muted" style="font-size:12px;margin-top:-2px">${shiftLbl(fact.best)}</div>` : ''}
    ${fact ? line('Факт: в среднем за смену', fmtNum(fact.avg, 0) + ' шт (' + fact.n + ' ' + (fact.n === 1 ? 'смена' : fact.n < 5 ? 'смены' : 'смен') + ')') : ''}
    ${fact && fact.n > 1 ? '<div class="muted" style="font-size:12px;margin-top:-2px">по всем внесённым сменам, включая неполные (наладка)</div>' : ''}
  </div>
  <div class="muted mt">Расчётное время, при работе станка в обе смены без остановок, кроме учтённой загрузки.</div></div>`;
}

function viewCalendar() {
  const m = curM();
  const y = ui.month.getFullYear(), mo = ui.month.getMonth();
  const first = new Date(y, mo, 1), days = new Date(y, mo + 1, 0).getDate();
  const startDow = (first.getDay() + 6) % 7;
  const todayIso = isoDate(new Date());
  let cells = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].map(d => `<div class="cal-dow">${d}</div>`).join('');
  for (let i = 0; i < startDow; i++) cells += '<div class="cal-day empty-cell"></div>';
  let monthTotal = 0; const byPerson = {};
  for (let d = 1; d <= days; d++) {
    const iso = y + '-' + pad(mo + 1) + '-' + pad(d);
    const arr = m.shifts[iso] || [];
    let sd = 0, sn = 0;
    arr.forEach(e => {
      const c = num(e.count), k = e.who || '—';
      const p = byPerson[k] || (byPerson[k] = { d: 0, n: 0 });
      if (shiftOf(e) === 'night') { sn += c; p.n += c; } else { sd += c; p.d += c; }
    });
    monthTotal += sd + sn;
    const hasD = arr.some(e => shiftOf(e) === 'day'), hasN = arr.some(e => shiftOf(e) === 'night');
    const marks = (hasD ? `<small>☀️${sd}</small>` : '') + (hasN ? `<small>🌙${sn}</small>` : '');
    cells += `<div class="cal-day ${arr.length ? 'has' : ''} ${iso === todayIso ? 'today' : ''}" data-act="calDay" data-d="${iso}">${d}${marks}</div>`;
  }
  const monthName = ui.month.toLocaleString('ru-RU', { month: 'long', year: 'numeric' });
  const persons = Object.entries(byPerson).sort((a, b) => (b[1].d + b[1].n) - (a[1].d + a[1].n)).map(([w, c]) =>
    `<div class="shift-row"><span>👤 ${esc(w)}<div class="muted">☀️ ${fmtNum(c.d, 0)} · 🌙 ${fmtNum(c.n, 0)}</div></span><b>${fmtNum(c.d + c.n, 0)} шт</b></div>`).join('');
  return header('Календарь смен', 'Станок №' + m.num, true) +
    `<div class="ui-card">
      <div class="cal-head"><button class="mini-btn" data-act="calPrev">←</button><b>${esc(monthName)}</b><button class="mini-btn" data-act="calNext">→</button></div>
      <div class="cal-grid">${cells}</div>
      <div class="muted mt">Нажмите на день, чтобы отметить, кто работал и сколько сделал.<br>☀️ день ${hh(DAY_START)}–${hh(NIGHT_START)} · 🌙 ночь ${hh(NIGHT_START)}–${hh(DAY_START)} (записывается на дату начала смены).</div>
    </div>
    <div class="ui-card"><div class="section-title">Итого за месяц: ${fmtNum(monthTotal, 0)} шт</div>${persons || '<div class="empty">Нет записей</div>'}</div>`;
}

function viewDay() {
  const m = curM(), d = ui.day, arr = m.shifts[d] || [];
  const [yy, mm, dd] = d.split('-');
  const total = arr.reduce((s, e) => s + num(e.count), 0);
  const block = type => {
    const list = arr.filter(e => shiftOf(e) === type);
    const sum = list.reduce((s, e) => s + num(e.count), 0);
    const rows = list.map(e => `<div class="shift-row"><span>👤 ${esc(e.who || '—')}: <b>${fmtNum(num(e.count), 0)} шт</b></span>
      <div class="row-actions">${can('editOthers') || (can('produce') && e.who === user) ? `<button class="mini-btn" data-act="shiftEdit" data-id="${e.id}">✎</button>` : ''}</div></div>`).join('');
    const hours = type === 'day' ? `${hh(DAY_START)}–${hh(NIGHT_START)}` : `${hh(NIGHT_START)}–${hh(DAY_START)} (до утра следующего дня)`;
    return `<div class="ui-card"><div class="section-title">${SHIFT_NAMES[type]} · ${fmtNum(sum, 0)} шт</div>
      <div class="muted" style="margin:-6px 0 10px">${hours}</div>
      ${rows || '<div class="empty">Записей нет</div>'}
      ${can('produce') ? `<button class="action-button secondary" data-act="shiftAdd" data-s="${type}">+ Отметить человека</button>` : ''}</div>`;
  };
  return header(`${dd}.${mm}.${yy}`, `Всего за сутки: ${fmtNum(total, 0)} шт · станок №${m.num}`, true) + block('day') + block('night');
}

/* Блок результата расчёта. Отдельная функция, чтобы его можно было
   перерисовывать на лету при вводе, не трогая поля ввода (иначе пропадёт курсор). */
function barResultHtml(m) {
  const c = m.barCfg;
  const qty = num(m.part.qty), len = num(m.part.len);
  const perPart = len + num(m.cutW) + num(c.face);
  const remnant = num(c.remnant);
  const usable = num(c.barLen) * 1000 - remnant;      // полезная длина одного прутка
  const ok = usable > 0;
  /* Огарок теряется на каждом прутке, поэтому общая потребность =
     длина деталей + огарки (по числу прутков, расчётное число без округления). */
  const calc = parts => {
    const exact = ok ? parts / usable : 0;
    return { parts, rem: exact * remnant, all: parts + exact * remnant, bars: Math.ceil(exact - 1e-9) };
  };
  const done = doneOf(m);
  const left = Math.max(0, qty - done);
  const all = calc(qty * perPart), rest = calc(left * perPart);
  const warn = !ok ? '<div class="muted" style="color:#C0392B;margin-top:6px">⚠️ Остаток-огарок больше длины прутка, проверьте значения.</div>' : '';
  const line = (a, b) => `<div class="result-line"><span>${a}</span><b>${b}</b></div>`;
  return `<div class="muted">Нужно прутка до конца партии (с огарками)</div>
    <div class="result-big">${fmtNum(rest.all / 1000)} м</div>
    ${line('Осталось сделать', fmtNum(left, 0) + ' шт из ' + fmtNum(qty, 0))}
    ${line('Прутков целиком (по ' + fmtNum(num(c.barLen)) + ' м)', rest.bars + ' шт')}
    <div style="border-top:1px solid #F2CDAE;margin:8px 0 4px"></div>
    ${line('Всего на партию (с огарками)', fmtNum(all.all / 1000) + ' м (' + all.bars + ' шт)')}
    ${line('Расход на 1 деталь', fmtNum(perPart) + ' мм')}
    ${line('Детали на всю партию (без огарков)', fmtNum(all.parts / 1000) + ' м')}
    ${line('Огарки на всю партию (' + fmtNum(remnant, 0) + ' мм × прутки)', fmtNum(all.rem / 1000) + ' м')}${warn}`;
}

function viewBar() {
  const m = curM(), c = m.barCfg;
  const ro = can('setup') ? '' : 'disabled';
  const field = (id, label, val) => `<div class="input-group"><label>${label}</label><input type="text" inputmode="decimal" id="${id}" value="${esc(val)}" ${ro}></div>`;
  return header('Расчёт прутка', 'Станок №' + m.num, true) +
    `<div class="ui-card">
      <div class="params-grid">
        <div class="param-cell"><span class="param-lbl">Деталь</span><span class="param-val">${esc(m.part.name || '—')}</span></div>
        <div class="param-cell"><span class="param-lbl">Партия</span><span class="param-val">${fmtNum(num(m.part.qty), 0)} шт</span></div>
        <div class="param-cell"><span class="param-lbl">Длина детали</span><span class="param-val">${fmtNum(num(m.part.len))} мм</span></div>
        <div class="param-cell"><span class="param-lbl">Пруток</span><span class="param-val">${m.bar.dia ? 'Ø' + esc(m.bar.dia) + ' мм' : '—'}</span></div>
      </div>
      <div class="two-col">
        ${field('b-cut', 'Отрезной резец (мм)', m.cutW)}
        ${field('b-face', 'Подрезка торца (мм)', c.face)}
      </div>
      <div class="two-col">
        ${field('b-len', 'Длина прутка (м)', c.barLen)}
        ${field('b-rem', 'Остаток-огарок (мм)', c.remnant)}
      </div>
      <div class="result-box" id="bar-result">${barResultHtml(m)}</div>
      <div class="muted mt">Расход на деталь = длина + ширина отрезного + подрезка торца. Огарок теряется на каждом прутке и добавляется к общей потребности. Результат пересчитывается сразу при вводе. ${can('setup') ? 'Длину детали и партию меняйте в «Наладке станка».' : 'Параметры расчёта меняет наладчик.'}</div>
    </div>`;
}

/* Пересчёт «на лету» при вводе в поля калькулятора */
const BAR_FIELDS = { 'b-cut': m => m, 'b-face': m => m.barCfg, 'b-len': m => m.barCfg, 'b-rem': m => m.barCfg };
const BAR_KEYS = { 'b-cut': 'cutW', 'b-face': 'face', 'b-len': 'barLen', 'b-rem': 'remnant' };
let barSaveTimer = null;
function barLiveUpdate(t) {
  const m = curM();
  if (!m || !can('setup')) return;
  BAR_FIELDS[t.id](m)[BAR_KEYS[t.id]] = num(t.value);
  const box = document.getElementById('bar-result');
  if (box) box.innerHTML = barResultHtml(m);
  clearTimeout(barSaveTimer);
  barSaveTimer = setTimeout(save, 700);      // сохраняем, когда человек на секунду остановился
}

const views = { list: viewList, machine: viewMachine, tools: viewTools, changes: viewChanges, program: viewProgram, drawing: viewDrawing, calendar: viewCalendar, day: viewDay, bar: viewBar };
function afterRender() {
  if (ui.tab === 'schedule' && ui.sched && ui.sched.scrollToday && document.getElementById('roster-wrap')) {
    ui.sched.scrollToday = false; schedScrollToToday();
  }
}
function render() {
  document.getElementById('app').innerHTML = viewHtml();
  window.scrollTo(0, 0);
  afterRender();
}
/* Перерисовка с сохранением прокрутки страницы и горизонтальных таблиц (data-keep-scroll) */
function rerender() {
  const y = window.scrollY, keep = {};
  document.querySelectorAll('[data-keep-scroll]').forEach(el => { keep[el.id] = el.scrollLeft; });
  document.getElementById('app').innerHTML = viewHtml();
  window.scrollTo(0, y);
  for (const id in keep) { const el = document.getElementById(id); if (el) el.scrollLeft = keep[id]; }
  afterRender();
}

function machineFields(m) {
  return [
    { k: 'num', label: 'Номер станка', value: m.num },
    { k: 'model', label: 'Модель', value: m.model, ph: 'Citizen L20, Star SR-20...' },
    { k: 'partName', label: 'Деталь', value: m.part.name },
    { k: 'len', label: 'Длина детали (мм)', type: 'number', value: m.part.len },
    { k: 'qty', label: 'Партия (шт)', type: 'number', value: m.part.qty },
    { k: 'dia', label: 'Пруток Ø (мм)', type: 'number', value: m.bar.dia },
    { k: 'cm', label: 'Цанга Main', value: m.collets.main },
    { k: 'cb', label: 'Цанга Back', value: m.collets.back },
    { k: 'cutW', label: 'Ширина отрезного (мм)', type: 'number', value: m.cutW },
    { k: 'cycle', label: 'Время цикла на 1 деталь (сек)', type: 'number', value: m.cycle || '', ph: 'например 24,5' },
    { k: 'eff', label: 'Загрузка станка, % (простои, смена прутка, наладка)', type: 'number', value: m.eff || 85 }
  ];
}
function applyMachine(m, o) {
  m.num = o.num || m.num; m.model = o.model;
  m.part = { name: o.partName, len: num(o.len), qty: num(o.qty) };
  m.bar.dia = num(o.dia);
  m.collets = { main: o.cm || (num(o.dia) > 0 ? fP(num(o.dia)) : ''), back: o.cb };
  m.cutW = num(o.cutW);
  m.cycle = Math.max(0, num(o.cycle));
  m.eff = Math.min(100, Math.max(1, num(o.eff) || 85));
}

const REASONS = ['Износ', 'Поломка', 'Смена партии', 'Профилактика', 'Другое'];

const Actions = {
  open(d) { ui.mid = d.id; ui.view = 'machine'; render(); },
  back() {
    if (ui.tab === 'threads') return thrBack();
    if (ui.tab === 'schedule') { ui.sched.view = 'grid'; ui.sched.scrollToday = true; return render(); }
    if (ui.usersOpen) { ui.usersOpen = false; return render(); }
    if (ui.view === 'machine') ui.view = 'list';
    else if (ui.view === 'day') ui.view = 'calendar';
    else if (ui.view === 'batch') ui.view = ui.batchFrom === 'all' ? 'allHistory' : 'history';
    else if (ui.view === 'allHistory') ui.view = 'list';
    else ui.view = 'machine';
    render();
  },
  go(d) { ui.view = d.v; render(); },
  setName() {
    modal('Профиль · ' + ((ROLES[myRole()] || {}).label || 'нет доступа'), [{ k: 'name', label: 'Фамилия Имя', value: user }], o => {
      if (!o.name) return false;
      user = o.name; localStorage.setItem('sc_user', user); render();
    });
  },
  addMachine() {
    const m = newMachine(pad(db.machines.length + 1), '');
    modal('Новый станок', machineFields(m), o => {
      applyMachine(m, o); db.machines.push(m); save(); render();
    }, null, autoCollet);
  },
  editMachine() {
    const m = curM();
    const archOk = !(Sync.enabled && Sync.noV4);                     // архив доступен (есть setup4.sql)
    const busy = !!m.part.name || doneOf(m) > 0;
    const openSetup = title => modal(title, machineFields(m), o => {
      if (!o.partName) { alert('Введите название детали'); return false; }
      applyMachine(m, o);
      if (!m.batchStart) m.batchStart = batchFirstDay(m) || new Date().toISOString();
      save(); render();
    }, () => {
      for (const [id, b] of Object.entries(db.batches)) if (b.machine_id === m.id) delete db.batches[id];
      db.machines = db.machines.filter(x => x.id !== m.id); save(); ui.view = 'list'; render();
    }, autoCollet);
    if (!archOk || !busy) return openSetup('Наладка станка');
    choice('Партия окончена?', `Деталь «${esc(m.part.name || 'без названия')}»: сделано ${fmtNum(doneOf(m), 0)} из ${fmtNum(num(m.part.qty), 0)} шт.<br><br>
      <b>Да</b> — деталь уйдёт в архив, начнётся новая партия: параметры детали, программа, чертёж и счётчики сбросятся (история смен сохранится).<br>
      <b>Нет</b> — просто изменить параметры текущей партии.`, [
      ['Да — в архив и новая партия', 'orange', async () => { await archiveCurrent(m); openSetup('Новая партия · наладка'); }],
      ['Нет — изменить текущую', '', () => openSetup('Наладка станка')],
      ['Отмена', 'secondary', null]
    ]);
  },
  adj(d) {
    if (!user) return Actions.setName();
    const m = curM(), e = todayEntry(m, true);
    e.count = Math.max(0, num(e.count) + num(d.n));
    save(); rerender();
  },

  /* инструменты */
  toolAdd() {
    const m = curM();
    modal('Новый инструмент', [
      { k: 'code', label: 'Позиция (T01...)', value: 'T' + pad(m.tools.length + 1) },
      { k: 'name', label: 'Название', value: '' },
      { k: 'spec', label: 'Пластина / размер', value: '' }
    ], o => { m.tools.push({ id: uid(), code: o.code, name: o.name, spec: o.spec }); save(); rerender(); });
  },
  toolEdit(d) {
    const m = curM(), t = m.tools.find(x => x.id === d.id);
    modal('Инструмент', [
      { k: 'code', label: 'Позиция', value: t.code },
      { k: 'name', label: 'Название', value: t.name },
      { k: 'spec', label: 'Пластина / размер', value: t.spec }
    ], o => { Object.assign(t, o); save(); rerender(); },
      () => { m.tools = m.tools.filter(x => x.id !== t.id); save(); rerender(); });
  },
  toolChange(d) {
    if (!user) return Actions.setName();
    const m = curM(), t = m.tools.find(x => x.id === d.id);
    modal('Замена: ' + t.code + ' ' + t.name, [
      { k: 'reason', label: 'Причина', type: 'select', options: REASONS, value: 'Износ' },
      { k: 'spec', label: 'Что установлено (пластина / размер)', value: t.spec },
      { k: 'comment', label: 'Комментарий', value: '' }
    ], o => {
      m.changes.push({ id: uid(), ts: new Date().toISOString(), who: user, code: t.code, tool: t.name, reason: o.reason, spec: o.spec, comment: o.comment });
      t.spec = o.spec || t.spec;
      save(); rerender();
    });
  },

  changeEdit(d) {
    const m = curM(), c = m.changes.find(x => x.id === d.id);
    if (!c || !canEditChange(c)) return;
    const dt = new Date(c.ts);
    const fields = [
      { k: 'tool', label: 'Инструмент', type: 'select', options: [...new Set([...m.tools.map(t => t.code + ' ' + t.name), c.code + ' ' + c.tool])], value: c.code + ' ' + c.tool },
      { k: 'reason', label: 'Причина', type: 'select', options: [...new Set([...REASONS, c.reason])], value: c.reason },
      { k: 'spec', label: 'Что установлено (пластина / размер)', value: c.spec || '' },
      { k: 'comment', label: 'Комментарий', value: c.comment || '' },
      { k: 'date', label: 'Дата и время (ДД.ММ.ГГГГ ЧЧ:ММ)', value: `${pad(dt.getDate())}.${pad(dt.getMonth() + 1)}.${dt.getFullYear()} ${pad(dt.getHours())}:${pad(dt.getMinutes())}` }
    ];
    if (can('editOthers')) fields.push({ k: 'who', label: 'Кто менял', value: c.who || '' });
    modal('Запись о замене', fields, o => {
      const mt = /^(\d{1,2})\.(\d{1,2})\.(\d{4})\s+(\d{1,2}):(\d{2})$/.exec(o.date);
      if (!mt) { alert('Дата в формате ДД.ММ.ГГГГ ЧЧ:ММ, например 06.11.2026 15:40'); return false; }
      const t = m.tools.find(x => x.code + ' ' + x.name === o.tool);
      if (t) { c.code = t.code; c.tool = t.name; }
      c.reason = o.reason; c.spec = o.spec; c.comment = o.comment;
      c.ts = new Date(+mt[3], +mt[2] - 1, +mt[1], +mt[4], +mt[5]).toISOString();
      if (can('editOthers') && o.who) c.who = o.who;
      m.changes.sort((a, b) => (a.ts < b.ts ? -1 : 1));
      save(); rerender();
    }, () => { m.changes = m.changes.filter(x => x.id !== c.id); save(); rerender(); });
  },

  /* программа */
  progEdit() {
    const m = curM(), p = m.program;
    modal('Программа', [
      { k: 'name', label: 'Номер / название (O1234)', value: p.name },
      { k: 'notes', label: 'Заметки', type: 'textarea', rows: 3, value: p.notes },
      { k: 'code', label: 'Текст программы (необязательно)', type: 'textarea', rows: 8, value: p.code }
    ], o => { m.program = o; save(); rerender(); });
  },

  /* чертёж */
  drawPick() {
    const inp = document.getElementById('drawfile');
    inp.onchange = () => {
      const f = inp.files[0]; if (!f) return;
      const img = new Image(), url = URL.createObjectURL(f);
      img.onload = () => {
        const max = 1400, k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const m = curM();
        m.drawing = c.toDataURL('image/jpeg', 0.75); m.hasDrawing = true; m.drawingV = Date.now();
        URL.revokeObjectURL(url); save(); rerender();
        Sync.putDrawing(m.id, m.drawing);
      };
      img.src = url;
    };
    inp.click();
  },
  drawView() {
    const w = document.createElement('div');
    w.className = 'fullscreen';
    w.innerHTML = `<img src="${curM().drawing}">`;
    w.onclick = () => w.remove();
    document.body.appendChild(w);
  },
  drawDel() {
    if (!confirm('Удалить чертёж?')) return;
    const m = curM();
    m.drawing = null; m.hasDrawing = false; m.drawingV = Date.now();
    save(); rerender(); Sync.delDrawing(m.id);
  },

      save(); rerender();
    });
  },
  shiftEdit(d) {
    const m = curM(), arr = m.shifts[ui.day], e = arr.find(x => x.id === d.id);
    modal('Запись смены', [
      { k: 'shift', label: 'Смена', type: 'select', options: [SHIFT_NAMES.day, SHIFT_NAMES.night], value: SHIFT_NAMES[shiftOf(e)] },

/* ---------- форматирование ---------- */
const f3 = v => { let r = Math.round(v * 1000 + (v >= 0 ? 1e-6 : -1e-6)) / 1000; if (Object.is(r, -0)) r = 0; return String(+r.toFixed(3)); };
const fDev = v => { const r = +f3(v); return r === 0 ? '0' : (r > 0 ? '+' : '') + r; };
const fP = v => String(+(+v).toFixed(3));
const thrName = (d, P, cls) => `M${fP(d)} x ${fP(P)}${cls ? ' - ' + cls : ''}`;
const withDot = v => { const s = String(v).trim().replace(',', '.'); return s === '' ? '' : (s.includes('.') ? s : s + '.0'); };

/* ---------- шаблон G76 (Fanuc, двухблочный формат) ---------- */
const G76_DEFAULT = { m: 3, r: 0, a: 60, qmin: 50, rf: 0.02, q1: 180, xd: 2 };
function g76Tpl() {
  let t = {};
  try { t = JSON.parse(localStorage.getItem('sc_g76') || '{}') || {}; } catch (e) {}
  return Object.assign({}, G76_DEFAULT, t);
}
function g76Save(t) { try { localStorage.setItem('sc_g76', JSON.stringify(t)); } catch (e) {} }
function g76Code(res, z) {
  const t = g76Tpl();
  const ext = res.kind === 'ext';
  const X = ext ? res.d - 1.2268693210 * res.P : res.d;          // наружная: d3 номинальный; внутренняя: D (дно резьбы)
  const h = Math.round(res.depth * 1000);                           // высота профиля, мкм
  const cap = Math.max(10, Math.round(h / 3 / 10) * 10);           // первый проход не больше 1/3 высоты профиля
  const q = Math.min(Math.round(num(t.q1)), cap);
  const p2 = n => String(Math.max(0, Math.min(99, Math.round(num(n))))).padStart(2, '0');
  const line1 = `G76P${p2(t.m)}${p2(t.r)}${p2(t.a)}Q${Math.round(num(t.qmin))}R${withDot(fP(num(t.rf)))};`;
  const line2 = `G76X${X.toFixed(Math.max(0, Math.min(3, Math.round(num(t.xd)))))}Z${withDot(z)}P${h}Q${q}F${withDot(fP(res.P))};`;
  return { text: line1 + '\n' + line2, X, h, q, qCapped: q < Math.round(num(t.q1)), t };
}

function thrHeader(title, sub) { return header(title, sub, ui.thr.step !== 'type'); }

function viewThreads() {
  const s = ui.thr;
  if (s.step === 'type') return header('Тип резьбы', 'ГОСТ 24705-2004 / ISO 965 · метрическая', false) +
    `<div class="kind-card" data-act="thrKind" data-k="int">${NUT_SVG}<div class="kind-lbl">Внутренняя резьба</div></div>
     <div class="kind-card" data-act="thrKind" data-k="ext">${BOLT_SVG}<div class="kind-lbl">Наружная резьба</div></div>`;

  if (s.step === 'dia') return thrHeader('Выберите диаметр', KIND_NAME[s.kind]) +
    THR.DIAMS.map(d => `<div class="big-btn" data-act="thrDia" data-d="${d}">M ${fP(d)}</div>`).join('') +
    `<div class="big-btn secondary" data-act="thrCustom">Другой диаметр…</div>`;

  if (s.step === 'pitch') {
    const groups = THR.pitchGroups(s.d);
    return thrHeader('Выберите шаг', KIND_NAME[s.kind] + ' · M' + fP(s.d)) +
      (groups.length ? groups.map(g => `<div class="group-title">${g.title}</div>` +
        g.list.map(P => `<div class="big-btn" data-act="thrPitch" data-p="${P}">M ${fP(s.d)} x ${fP(P)}</div>`).join('')).join('')
        : '<div class="ui-card"><div class="empty">Для этого диаметра в ГОСТ 16093 нет данных (поддерживается 1–90 мм).</div></div>');
  }

  if (s.step === 'class') {
    const list = THR.classes(s.kind, s.d, s.P);
    return thrHeader('Выберите допуск', KIND_NAME[s.kind]) +
      (list.length ? list.map(cl => `<div class="big-btn" data-act="thrCls" data-c="${cl}">${thrName(s.d, s.P, cl)}</div>`).join('')
        : '<div class="ui-card"><div class="empty">Для этого шага нет полей допуска в ГОСТ 16093.</div></div>');
  }

  // информация о резьбе
  const res = THR.calc(s.kind, s.d, s.P, s.cls);
  if (res.error) return thrHeader('Информация о резьбе', '') + `<div class="ui-card"><div class="empty">${esc(res.error)}</div></div>`;
  const ext = s.kind === 'ext';
  const kv = (a, b) => `<div class="kv"><span>${a}</span><b>${b}</b></div>`;
  const dimRow = r => {
    if (r.key === 'drill') return `<div class="kv kv-strong"><span>Диаметр отверстия под резьбу</span><b>${f3(res.drill)}</b></div>`;
    const devs = [r.max - r.nom, r.min - r.nom].filter(v => Math.abs(v) >= 0.0005);
    return `<div class="dim">
      <div class="dim-head"><span class="dim-name">${r.name}</span><span class="dim-nom">${f3(r.nom)}</span>
        <span class="dim-dev">${devs.map(fDev).join('<br>')}</span></div>
      <div class="dim-grid"><div><small>мин</small>${f3(r.min)}</div><div><small>сред.</small>${f3((r.min + r.max) / 2)}</div><div><small>макс</small>${f3(r.max)}</div></div>
      ${r.note ? `<div class="dim-note">${r.note}</div>` : ''}
    </div>`;
  };
  return thrHeader('Информация о резьбе', thrName(s.d, s.P, s.cls)) +
    `<div class="ui-card">
      <div class="thr-title">${thrName(s.d, s.P, s.cls)}</div>
      <div class="thr-sub">M - Метрическая цилиндрическая ${ext ? 'наружная' : 'внутренняя'} резьба<br>${THR.pitchType(s.d, s.P)}</div>
      ${kv('Тип резьбы', KIND_NAME[s.kind])}
      ${kv('Диаметр (номинальный)', fP(s.d))}
      ${kv('Шаг', fP(s.P))}
      ${kv('Глубина резьбы', f3(res.depth))}
      ${kv('Класс допуска', s.cls)}
      ${kv('Тип шага', THR.pitchType(s.d, s.P))}
    </div>
    <div class="ui-card">${res.rows.map(dimRow).join('')}</div>
    ${g76Card(res)}
    <div class="ui-card">
      <div class="section-title">Профиль резьбы</div>
      ${kv('H - Высота исходного треугольника', f3(res.H))}
      ${kv('H1 - Рабочая высота профиля (5/8 H)', f3(0.5412658774 * s.P))}
      ${kv(ext ? 'h3 - Высота профиля болта' : 'Глубина резьбы гайки', f3(res.depth))}
      ${kv('R - Радиус впадины, не менее (0,125P)', f3(0.125 * s.P))}
      ${kv(ext ? 'es - Основное отклонение, мкм' : 'EI - Основное отклонение, мкм', ext ? res.es : res.EI)}
      ${ext ? kv('Td / Td2, мкм', res.Td + ' / ' + res.Td2) : kv('TD1 / TD2, мкм', res.TD1 + ' / ' + res.TD2)}
      <div class="muted mt">Допуски — ГОСТ 16093-2004 (ИСО 965-1), размеры — ГОСТ 24705-2004.</div>
    </div>`;
}

function g76Card(res) {
  const s = ui.thr, g = g76Code(res, s.z), t = g.t;
  const inp = (id, label, val) => `<div class="input-group"><label>${label}</label><input type="text" inputmode="decimal" id="${id}" value="${esc(val)}"></div>`;
  return `<div class="ui-card">
    <div class="section-title">Код G76 (Fanuc)</div>
    ${inp('g76-z', 'Z — конец резьбы (впишите сами, можно оставить пустым)', s.z)}
    <pre class="gcode" id="g76-code">${esc(g.text)}</pre>
    <button class="action-button" data-act="g76Copy" id="g76-copy">Скопировать код</button>
    <div class="g76-info" id="g76-info">${g76Info(res, g)}</div>
    <button class="action-button secondary mt" data-act="g76Tpl">${s.tpl ? 'Скрыть шаблон' : '⚙️ Шаблон G76 (P, Q, R первой строки)'}</button>
    ${s.tpl ? `<div class="mt">
      <div class="two-col">${inp('g76-m', 'Чистовых проходов (m)', t.m)}${inp('g76-r', 'Сбег/фаска (r, ×0,1 шага)', t.r)}</div>
      <div class="two-col">${inp('g76-a', 'Угол профиля (a)', t.a)}${inp('g76-qmin', 'Мин. съём Q, мкм', t.qmin)}</div>
      <div class="two-col">${inp('g76-rf', 'Чистовой припуск R, мм', t.rf)}${inp('g76-q1', 'Первый проход Q, мкм', t.q1)}</div>
      ${inp('g76-xd', 'Знаков после запятой в X', t.xd)}
      <button class="action-button secondary" data-act="g76Reset">Вернуть шаблон по умолчанию</button>
      <div class="muted mt">Шаблон сохраняется на этом телефоне и применяется ко всем резьбам.</div>
    </div>` : ''}
  </div>`;
}
function g76Info(res, g) {
  const ext = res.kind === 'ext';
  return `<div class="kv"><span>X — ${ext ? 'диаметр по впадине d3 (номинал)' : 'диаметр по дну резьбы D (номинал)'}</span><b>${g.X.toFixed(3)}</b></div>
    <div class="kv"><span>P — высота профиля, мкм (${ext ? '0,6134' : '0,5413'}·шаг)</span><b>${g.h}</b></div>
    <div class="kv"><span>Q — первый проход, мкм${g.qCapped ? ' (ограничен 1/3 высоты)' : ''}</span><b>${g.q}</b></div>
    <div class="kv"><span>F — шаг</span><b>${fP(res.P)}</b></div>`;
}
function g76Refresh() {
  const s = ui.thr, res = THR.calc(s.kind, s.d, s.P, s.cls);
  if (res.error) return;
  const g = g76Code(res, s.z);
  const code = document.getElementById('g76-code'), info = document.getElementById('g76-info');
  if (code) code.textContent = g.text;
  if (info) info.innerHTML = g76Info(res, g);
}

function viewStub(title, sub, text) {
  return header(title, sub, false) + `<div class="ui-card"><div class="empty" style="padding:30px 10px">🛠 ${text}</div></div>`;
}

const TABS = [
  { k: 'machines', ico: '🏭', t: 'Станки' },

const navHtml = () => ((Sync.enabled && !Sync.ready) || (usersOn() && !myRole())) ? '' : `<nav class="tabbar"><div class="tabbar-in">${TABS.filter(x => can('tab:' + x.k)).map(x =>

function tabHtml() {
  const lg = gateView(); if (lg) return lg;                          // загрузка данных
  const acc = accessGate(); if (acc) return acc;                     // нет доступа: заявка / ожидание

const THR_ORDER = ['type', 'dia', 'pitch', 'class', 'info'];
function thrBack() {
  const i = THR_ORDER.indexOf(ui.thr.step);
  ui.thr.step = THR_ORDER[Math.max(0, i - 1)];
  render();
}

function copyText(text, btn) {
  const done = () => { if (btn) { const o = btn.textContent; btn.textContent = '✅ Скопировано'; setTimeout(() => { btn.textContent = o; }, 1500); } };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { alert(text); }
    ta.remove();
  };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
}

Object.assign(Actions, {
  tab(d) { ui.tab = d.t; if (d.t === 'schedule') ui.sched.scrollToday = true; render(); },
  thrKind(d) { ui.thr.kind = d.k; ui.thr.step = 'dia'; render(); },
  thrDia(d) { ui.thr.d = +d.d; ui.thr.step = 'pitch'; render(); },
  thrCustom() {
    modal('Свой диаметр', [{ k: 'd', label: 'Номинальный диаметр, мм (1–90)', type: 'number', value: '' }], o => {
      const v = num(o.d);
      if (!(v >= 1 && v <= 90)) { alert('Диаметр должен быть от 1 до 90 мм'); return false; }
      ui.thr.d = v; ui.thr.step = 'pitch'; render();
    });
  },
  thrPitch(d) { ui.thr.P = +d.p; ui.thr.step = 'class'; render(); },
  thrCls(d) { ui.thr.cls = d.c; ui.thr.step = 'info'; render(); },
  g76Copy(d) {
    const s = ui.thr, res = THR.calc(s.kind, s.d, s.P, s.cls);
    if (!res.error) copyText(g76Code(res, s.z).text, document.getElementById('g76-copy'));
  },
  g76Tpl() { ui.thr.tpl = !ui.thr.tpl; rerender(); },
  g76Reset() { g76Save({}); rerender(); }
});

const G76_KEYS = { 'g76-m': 'm', 'g76-r': 'r', 'g76-a': 'a', 'g76-qmin': 'qmin', 'g76-rf': 'rf', 'g76-q1': 'q1', 'g76-xd': 'xd' };
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'g76-z') { ui.thr.z = e.target.value; g76Refresh(); }
  else if (G76_KEYS[id]) {
    const t = g76Tpl(); t[G76_KEYS[id]] = e.target.value; g76Save(t); g76Refresh();
  }
});

/* =====================================================================
   ГРАФИК СМЕН
   Сетка «люди × дни месяца». В клетке: Д — день, Н — ночь, пусто — выходной.
   Составляет и правит только админ (кнопка «Редактировать»), остальные смотрят.
   ===================================================================== */
const WD = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
ui.sched = { month: new Date(new Date().getFullYear(), new Date().getMonth(), 1), edit: false, view: 'grid', scrollToday: true };
const schedNorm = () => { let n = 3; try { n = +localStorage.getItem('sc_norm') || 3; } catch (e) {} return n; };
const schedCanEdit = () => can('sched') && !(Sync.enabled && Sync.noRoster);
const ROSTER_PATTERNS = {
  '2 дня / 2 выходных': ['d', 'd', null, null],
  '2 ночи / 2 выходных': ['n', 'n', null, null],
  'День / ночь / 2 выходных': ['d', 'n', null, null],
  '2 дня / 2 ночи / 4 выходных': ['d', 'd', 'n', 'n', null, null, null, null],
  'Каждый день — день': ['d'],
  'Каждый день — ночь': ['n'],
  '5/2 — будни днём': 'wd-d',
  '5/2 — будни ночью': 'wd-n',
  'Очистить (все выходные)': [null]
};
function monthDays(m) {
  const y = m.getFullYear(), mo = m.getMonth(), n = new Date(y, mo + 1, 0).getDate();
  return Array.from({ length: n }, (_, i) => { const dt = new Date(y, mo, i + 1); return { n: i + 1, iso: isoDate(dt), dow: dt.getDay() }; });
}
function rosterGet(iso, sid) { return (db.roster[iso] || {})[sid] || null; }
function rosterSet(iso, sid, v) {
  if (v) (db.roster[iso] = db.roster[iso] || {})[sid] = v;
  else if (db.roster[iso]) { delete db.roster[iso][sid]; if (!Object.keys(db.roster[iso]).length) delete db.roster[iso]; }
}
function staffTotals(sid, days) {
  let d = 0, n = 0;
  days.forEach(x => { const v = rosterGet(x.iso, sid); if (v === 'd') d++; else if (v === 'n') n++; });
  return { d, n, all: d + n };
}

function viewSchedule() {
  if (ui.sched.view === 'staff') return viewStaff();
  if (ui.sched.view === 'att' && can('attView')) return viewAtt();
  if (ui.sched.view === 'qr' && can('sched')) return viewQr();
  const days = monthDays(ui.sched.month), todayIso = isoDate(new Date());
  const nowD = new Date(), attStart = attOn() ? attStartDay() : null;
  const monthName = ui.sched.month.toLocaleString('ru-RU', { month: 'long', year: 'numeric' });
  const canEdit = schedCanEdit(), editing = canEdit && ui.sched.edit, norm = schedNorm();
  const staff = db.staff;
  const covCls = c => (c >= norm ? 'cov-ok' : c >= norm - 1 ? 'cov-mid' : 'cov-low');
  let grid = '';
  if (staff.length) {
    const head = `<tr><th class="rs-name">${editing ? 'Тап по имени — шаблон' : 'Сотрудник'}</th>${days.map(x =>
      `<th class="${x.dow === 0 || x.dow === 6 ? 'we' : ''} ${x.iso === todayIso ? 'today' : ''}"><small>${WD[x.dow]}</small>${x.n}</th>`).join('')}</tr>`;
    const body = staff.map(p => {
      const t = staffTotals(p.id, days);
      return `<tr><td class="rs-name" ${editing ? `data-act="rosterFill" data-sid="${p.id}"` : ''}>${esc(p.name)}<small>☀${t.d} 🌙${t.n} · ${t.all}</small></td>${days.map(x => {
        const v = rosterGet(x.iso, p.id);
        const ac = attCellCls(x.iso, p.id, v, attStart, nowD);
        const fact = !v && ac === 'att-extra' ? attFor(x.iso, p.id) : null;      // вышел вне графика
        return `<td class="rs-c ${v || ''} ${ac} ${x.iso === todayIso ? 'today' : ''}" ${editing ? `data-act="rosterTap" data-day="${x.iso}" data-sid="${p.id}"` : ''}>${v === 'd' ? 'Д' : v === 'n' ? 'Н' : fact ? (fact.shift === 'd' ? 'д' : 'н') : ''}</td>`;
      }).join('')}</tr>`;
    }).join('');
    const cov = (sh, label) => `<tr class="rs-cov"><td class="rs-name">${label}</td>${days.map(x => {
      const c = staff.filter(p => rosterGet(x.iso, p.id) === sh).length;
      return `<td class="${covCls(c)} ${x.iso === todayIso ? 'today' : ''}">${c}</td>`;
    }).join('')}</tr>`;
    grid = `<div class="roster-wrap" id="roster-wrap" data-keep-scroll><table class="roster ${editing ? 'editing' : ''}">
      <thead>${head}</thead><tbody>${body}${cov('d', '☀️ На день')}${cov('n', '🌙 На ночь')}</tbody></table></div>`;
  }
  const totals = staff.map(p => { const t = staffTotals(p.id, days); return { p, t }; }).sort((a, b) => b.t.all - a.t.all);
  return header('График смен', monthName, false) + checkinCard() +
    `<div class="ui-card">
      <div class="cal-head"><button class="mini-btn" data-act="schedMonth" data-dir="-1">←</button><b>${esc(monthName)}</b><button class="mini-btn" data-act="schedMonth" data-dir="1">→</button></div>
      <div class="legend"><span class="lg d">Д</span> день ${hh(DAY_START)}–${hh(NIGHT_START)} <span class="lg n">Н</span> ночь ${hh(NIGHT_START)}–${hh(DAY_START)} <span class="lg">&nbsp;</span> выходной</div>
      ${Sync.enabled && Sync.noRoster ? `<div class="warn-box">⚠️ В базе ещё нет таблиц для графика. Админу нужно один раз выполнить файл <b>setup2.sql</b> в Supabase (SQL Editor). До этого график не сохраняется.</div>` : ''}
      ${canEdit ? `<div class="two-col mt">
        <button class="action-button ${editing ? 'orange' : ''}" data-act="schedEdit">${editing ? '✅ Готово' : '✏️ Редактировать'}</button>
        <button class="action-button secondary" data-act="schedStaff">👥 Сотрудники</button></div>
        ${editing ? '<div class="muted mt">Тап по клетке: выходной → Д → Н → выходной. Тап по имени — заполнить по шаблону.</div>' : ''}` : ''}
      ${attOn() && (can('attView') || can('sched')) ? `<div class="two-col mt">${can('attView') ? '<button class="action-button secondary" data-act="schedAtt">🕒 Явка</button>' : ''}
        ${can('sched') ? '<button class="action-button secondary" data-act="schedQr">🔳 QR для печати</button>' : ''}</div>` : ''}
    </div>
    ${staff.length ? grid : `<div class="ui-card"><div class="empty">В графике пока нет сотрудников.${canEdit ? '<br>Нажмите «👥 Сотрудники», чтобы добавить людей.' : ''}</div></div>`}
    ${staff.length ? `<div class="ui-card mt"><div class="section-title">Смен за месяц</div>
      ${totals.map(({ p, t }) => { const f = attStart ? attMonth(p.id, days) : null;
        return `<div class="shift-row"><span>👤 ${esc(p.name)}<div class="muted">☀️ ${t.d} · 🌙 ${t.n} · ${t.all * SHIFT_HOURS} ч по плану${f ? `<br>по факту: ${f.n} смен · ${fmtNum(f.h, 1)} ч${f.late ? ' · опозданий ' + f.late : ''}` : ''}</div></span><b>${t.all}</b></div>`; }).join('')}
      ${attStart ? '<div class="legend" style="margin:6px 0"><span class="lg att-ok">&nbsp;</span> отметился <span class="lg att-late">&nbsp;</span> опоздал <span class="lg att-miss">&nbsp;</span> не отметился <span class="lg att-extra">д</span> вышел вне графика</div>' : ''}
      <div class="muted">Внизу сетки — сколько человек на каждой смене: зелёный — ${norm} и больше, жёлтый — ${norm - 1}, красный — меньше.</div></div>` : ''}`;
}

/* =====================================================================
   ЯВКА: отметка прихода/ухода по QR-коду
   Один и тот же QR: первый скан — приход, следующий (в течение 16 ч) — уход.
   Смена определяется по ближайшему началу смены; плановая смена из графика в приоритете.
   ===================================================================== */
const CHECKIN_CODE = 'SWISSCONTROL:CHECKIN';      // текст QR-кода (для iPad с меняющимся кодом поменяем только проверку)
const LATE_GRACE_MIN = 5;                          // опоздание считается после 5 минут
const attOn = () => !(Sync.enabled && (Sync.noRoster || Sync.noAtt));
const myStaff = () => { const id = tgId(); return id ? db.staff.find(s => s.tg_id != null && String(s.tg_id) === String(id)) : null; };
const shiftStart = (day, t) => { const [y, m, d] = day.split('-').map(Number); return new Date(y, m - 1, d, t === 'n' ? NIGHT_START : DAY_START, 0, 0); };
const shiftEnd = (day, t) => new Date(shiftStart(day, t).getTime() + SHIFT_HOURS * 3600e3);
const attId = (day, t, sid) => day + '_' + t + '_' + sid;
const hm = iso => { const d = new Date(iso); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const durTxt = ms => { const m = Math.max(0, Math.round(ms / 60000)); return Math.floor(m / 60) + ' ч ' + pad(m % 60) + ' мин'; };
const lateMin = a => Math.round((new Date(a.in_ts) - shiftStart(a.day, a.shift)) / 60000);
const earlyMin = a => (a.out_ts ? Math.round((shiftEnd(a.day, a.shift) - new Date(a.out_ts)) / 60000) : 0);
const shiftTxt = (day, t) => (t === 'n' ? '🌙 ночь ' : '☀️ день ') + day.slice(8) + '.' + day.slice(5, 7);

function openAtt(sid, now) {
  return Object.values(db.att).find(a => a.staff_id === sid && !a.out_ts && now - new Date(a.in_ts) >= 0 && now - new Date(a.in_ts) < 16 * 3600e3) || null;
}
function pickShift(sid, now) {
  const c = [];
  for (let k = -1; k <= 1; k++) {
    const d = new Date(now); d.setDate(d.getDate() + k); const day = isoDate(d);
    ['d', 'n'].forEach(t => c.push({ day, type: t, diff: Math.abs(now - shiftStart(day, t)), plan: rosterGet(day, sid) === t }));
  }
  const planned = c.filter(x => x.plan && x.diff <= 4 * 3600e3).sort((a, b) => a.diff - b.diff)[0];
  return planned || c.sort((a, b) => a.diff - b.diff)[0];
}
/* Отметка: приход или уход. Возвращает { kind: 'in' | 'out' | 'done', rec } */
function doCheck(sid, now) {
  const open = openAtt(sid, now);
  if (open) { open.out_ts = now.toISOString(); save(); return { kind: 'out', rec: open }; }
  const s = pickShift(sid, now), id = attId(s.day, s.type, sid);
  if (db.att[id] && db.att[id].out_ts) return { kind: 'done', rec: db.att[id] };
  db.att[id] = { id, staff_id: sid, day: s.day, shift: s.type, in_ts: now.toISOString(), out_ts: null, by_admin: false };
  save(); return { kind: 'in', rec: db.att[id] };
}
function attFor(iso, sid) { return db.att[attId(iso, 'd', sid)] || db.att[attId(iso, 'n', sid)] || null; }
function attStartDay() { let m = null; for (const a of Object.values(db.att)) if (!m || a.day < m) m = a.day; return m; }
/* класс отметки в клетке графика */
function attCellCls(iso, sid, plan, startDay, now) {
  if (!startDay) return '';
  const a = (plan && db.att[attId(iso, plan, sid)]) || attFor(iso, sid);
  if (a) return plan && a.shift === plan ? (lateMin(a) > LATE_GRACE_MIN ? 'att-late' : 'att-ok') : 'att-extra';
  if (plan && iso >= startDay && shiftEnd(iso, plan) < now) return 'att-miss';
  return '';
}
function attMonth(sid, days) {
  let n = 0, ms = 0, late = 0, noOut = 0;
  days.forEach(x => ['d', 'n'].forEach(t => {
    const a = db.att[attId(x.iso, t, sid)]; if (!a) return;
    n++; if (lateMin(a) > LATE_GRACE_MIN) late++;
    if (a.out_ts) ms += new Date(a.out_ts) - new Date(a.in_ts); else noOut++;
  }));
  return { n, h: ms / 3600e3, late, noOut };
}

function loadScript(src) {
