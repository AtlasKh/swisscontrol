const TOL = (() => {
  // основные интервалы
  const R = [[0, 3], [3, 6], [6, 10], [10, 18], [18, 30], [30, 50], [50, 80], [80, 120], [120, 180], [180, 250], [250, 315], [315, 400], [400, 500]];
  // промежуточные интервалы (для a, b, c, r, s, t, u, x, z)
  const S = [[0, 3], [3, 6], [6, 10], [10, 14], [14, 18], [18, 24], [24, 30], [30, 40], [40, 50], [50, 65], [65, 80], [80, 100], [100, 120],
    [120, 140], [140, 160], [160, 180], [180, 200], [200, 225], [225, 250], [250, 280], [280, 315], [315, 355], [355, 400], [400, 450], [450, 500]];
  const S2R = S.map(([lo, hi]) => R.findIndex(r => lo >= r[0] && hi <= r[1]));
  const rows = t => t.trim().split('\n').map(l => l.trim().split(/\s+/).map(v => (v === '-' ? null : +v)));
  // Таблица 1: IT1…IT18 по основным интервалам
  const IT = rows(`
    0.8 1.2 2 3 4 6 10 14 25 40 60 100 140 250 400 600 1000 1400
    1 1.5 2.5 4 5 8 12 18 30 48 75 120 180 300 480 750 1200 1800
    1 1.5 2.5 4 6 9 15 22 36 58 90 150 220 360 580 900 1500 2200
    1.2 2 3 5 8 11 18 27 43 70 110 180 270 430 700 1100 1800 2700
    1.5 2.5 4 6 9 13 21 33 52 84 130 210 330 520 840 1300 2100 3300
    1.5 2.5 4 7 11 16 25 39 62 100 160 250 390 620 1000 1600 2500 3900
    2 3 5 8 13 19 30 46 74 120 190 300 460 740 1200 1900 3000 4600
    2.5 4 6 10 15 22 35 54 87 140 220 350 540 870 1400 2200 3500 5400
    3.5 5 8 12 18 25 40 63 100 160 250 400 630 1000 1600 2500 4000 6300
    4.5 7 10 14 20 29 46 72 115 185 290 460 720 1150 1850 2900 4600 7200
    6 8 12 16 23 32 52 81 130 210 320 520 810 1300 2100 3200 5200 8100
    7 9 13 18 25 36 57 89 140 230 360 570 890 1400 2300 3600 5700 8900
    8 10 15 20 27 40 63 97 155 250 400 630 970 1550 2500 4000 6300 9700`);
  // es валов a, b, c — по промежуточным интервалам
  const ABC = rows(`
    -270 -140 -60
    -270 -140 -70
    -280 -150 -80
    -290 -150 -95
    -290 -150 -95
    -300 -160 -110
    -300 -160 -110
    -310 -170 -120
    -320 -180 -130
    -340 -190 -140
    -360 -200 -150
    -380 -220 -170
    -410 -240 -180
    -460 -260 -200
    -520 -280 -210
    -580 -310 -230
    -660 -340 -240
    -740 -380 -260
    -820 -420 -280
    -920 -480 -300
    -1050 -540 -330
    -1200 -600 -360
    -1350 -680 -400
    -1500 -760 -440
    -1650 -840 -480`);
  // es валов d, e, f, g и ei валов k(IT4–IT7), m, n, p — по основным интервалам
  const DG = rows(`
    -20 -14 -6 -2 0 2 4 6
    -30 -20 -10 -4 1 4 8 12
    -40 -25 -13 -5 1 6 10 15
    -50 -32 -16 -6 1 7 12 18
    -65 -40 -20 -7 2 8 15 22
    -80 -50 -25 -9 2 9 17 26
    -100 -60 -30 -10 2 11 20 32
    -120 -72 -36 -12 3 13 23 37
    -145 -85 -43 -14 3 15 27 43
    -170 -100 -50 -15 4 17 31 50
    -190 -110 -56 -17 4 20 34 56
    -210 -125 -62 -18 4 21 37 62
    -230 -135 -68 -20 5 23 40 68`);
  // ei валов r, s, t, u, x, z — по промежуточным интервалам
  const RZ = rows(`
    10 14 - 18 20 26
    15 19 - 23 28 35
    19 23 - 28 34 42
    23 28 - 33 40 50
    23 28 - 33 45 60
    28 35 - 41 54 73
    28 35 41 48 64 88
    34 43 48 60 80 112
    34 43 54 70 97 136
    41 53 66 87 122 172
    43 59 75 102 145 210
    51 71 91 124 178 258
    54 79 104 144 210 310
    63 92 122 170 248 365
    65 100 134 190 280 415
    68 108 146 210 310 465
    77 122 166 236 350 520
    80 130 180 258 385 575
    84 140 196 284 425 640
    94 158 218 315 475 710
    98 170 240 350 525 790
    108 190 268 390 590 900
    114 208 294 435 660 1000
    126 232 330 490 740 1100
    132 252 360 540 820 1250`);
  // Δ для IT3…IT8 по основным интервалам (для отверстий K, M, N и P…ZC)
  const DELTA = rows(`
    0 0 0 0 0 0
    1 1.5 1 3 4 6
    1 1.5 2 3 6 7
    1 2 3 3 7 9
    1.5 2 3 4 8 12
    1.5 3 4 5 9 14
    2 3 5 6 11 16
    2 4 5 7 13 19
    3 4 6 7 15 23
    3 4 6 9 17 26
    4 4 7 9 20 29
    4 5 7 11 21 32
    5 5 7 13 23 34`);
  // допустимые квалитеты для основных отклонений (по ISO 286-2 / ГОСТ 25347)
  const G = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
  const SHAFT = { a: G(9, 13), b: G(9, 13), c: G(8, 13), d: G(6, 13), e: G(5, 10), f: G(4, 10), g: G(4, 10), h: G(4, 18), js: G(4, 18),
    k: G(4, 13), m: G(4, 9), n: G(4, 9), p: G(4, 10), r: G(4, 10), s: G(4, 10), t: G(5, 8), u: G(5, 9), x: G(5, 10), z: G(6, 11) };
  const HOLE = { A: G(9, 13), B: G(8, 13), C: G(8, 13), D: G(6, 13), E: G(5, 10), F: G(4, 10), G: G(4, 10), H: G(4, 18), JS: G(4, 18),
    K: G(4, 8), M: G(4, 10), N: G(4, 11), P: G(4, 10), R: G(4, 10), S: G(4, 10), T: G(5, 8), U: G(5, 10), X: G(5, 10), Z: G(6, 11) };
  const POPULAR = { hole: ['H7', 'H8', 'H9', 'H11', 'H12', 'H13', 'H14', 'G7', 'F7', 'F8', 'E9', 'D10', 'JS7', 'K7', 'M7', 'N7', 'P7'],
    shaft: ['h6', 'h7', 'h8', 'h9', 'h11', 'h12', 'h13', 'h14', 'g6', 'f7', 'e8', 'd9', 'js6', 'k6', 'm6', 'n6', 'p6', 'r6', 's6'] };

  const subIdx = D => S.findIndex(([lo, hi]) => D > lo && D <= hi);
  const jsHalf = (it, g) => (g >= 7 && g <= 11 && it % 2 === 1 ? (it - 1) / 2 : it / 2);
  /* предельные отклонения поля допуска для промежуточного интервала si (мкм) */
  function devAt(kind, letter, grade, si) {
    const ri = S2R[si], it = IT[ri][grade - 1];
    if (kind === 'shaft') {
      const L = letter;
      if (!SHAFT[L] || !SHAFT[L].includes(grade)) return null;
      if (L === 'js') { const h = jsHalf(it, grade); return { up: h, lo: -h, it }; }
      let es = null, ei = null;
      if ('abc'.includes(L) && L.length === 1) es = ABC[si]['abc'.indexOf(L)];
      else if ('defg'.includes(L)) es = DG[ri]['defg'.indexOf(L)];
      else if (L === 'h') es = 0;
      else if (L === 'k') ei = grade >= 4 && grade <= 7 ? DG[ri][4] : 0;
      else if ('mnp'.includes(L)) ei = DG[ri][5 + 'mnp'.indexOf(L)];
      else ei = RZ[si]['rstuxz'.indexOf(L)];
      if (es != null) return { up: es, lo: es - it, it };
      if (ei == null) return null;
      return { up: ei + it, lo: ei, it };
    }
    const L = letter;
    if (!HOLE[L] || !HOLE[L].includes(grade)) return null;
    if (L === 'JS') { const h = jsHalf(it, grade); return { up: h, lo: -h, it }; }
    if ('ABCDEFGH'.includes(L)) {           // EI = −es вала той же буквы
      const s = devAt('shaft', L.toLowerCase(), Math.min(Math.max(grade, SHAFT[L.toLowerCase()][0]), SHAFT[L.toLowerCase()].slice(-1)[0]), si);
      if (!s) return null;
      const EI = L === 'H' ? 0 : -s.up;
      return { up: EI + it, lo: EI, it };
    }
    const delta = grade >= 3 && grade <= 8 ? DELTA[ri][grade - 3] : 0;
    let ES;
    if (L === 'K') ES = -(DG[ri][4]) + delta;                        // ≤IT8
    else if (L === 'M') ES = grade <= 8 ? -DG[ri][5] + delta : -DG[ri][5];
    else if (L === 'N') ES = grade <= 8 ? -DG[ri][6] + delta : 0;
    else {
      const ei = L === 'P' ? DG[ri][7] : RZ[si]['RSTUXZ'.indexOf(L)];
      if (ei == null) return null;
      ES = grade <= 7 ? -ei + delta : -ei;
    }
    if (L === 'M' && grade === 6 && ri === 10) ES = -9;            // особый случай ГОСТ/ISO: M6 св. 250 до 315
    return { up: ES, lo: ES - it, it };
  }
  function calc(kind, letter, grade, D) {
    const si = subIdx(D);
    if (si < 0) return null;
    const d = devAt(kind, letter, grade, si);
    return d && Object.assign({ si, range: S[si] }, d);
  }
  /* таблица по всем интервалам, соседние интервалы с одинаковыми значениями объединяются */
  function table(kind, letter, grade) {
    const out = [];
    S.forEach((rg, si) => {
      const d = devAt(kind, letter, grade, si);
      if (!d) return;
      const last = out[out.length - 1];
      if (last && last.up === d.up && last.lo === d.lo && last.hi === rg[0]) { last.hi = rg[1]; last.sis.push(si); }
      else out.push({ lo0: rg[0], hi: rg[1], up: d.up, lo: d.lo, it: d.it, sis: [si] });
    });
    return out;
  }
  // ГОСТ 30893.1-2002 / ISO 2768-1
  const LIN = { ranges: [[0.5, 3], [3, 6], [6, 30], [30, 120], [120, 400], [400, 1000], [1000, 2000], [2000, 4000]],
    f: [0.05, 0.05, 0.1, 0.15, 0.2, 0.3, 0.5, null], m: [0.1, 0.1, 0.2, 0.3, 0.5, 0.8, 1.2, 2],
    c: [0.2, 0.3, 0.5, 0.8, 1.2, 2, 3, 4], v: [null, 0.5, 1, 1.5, 2.5, 4, 6, 8] };
  const EDGE = { ranges: [[0.5, 3], [3, 6], [6, Infinity]], f: [0.2, 0.5, 1], m: [0.2, 0.5, 1], c: [0.4, 1, 2], v: [0.4, 1, 2] };
  const ANG = { ranges: ['до 10', 'св. 10 до 50', 'св. 50 до 120', 'св. 120 до 400', 'св. 400'],
    f: ['1°', '30′', '20′', '10′', '5′'], m: ['1°', '30′', '20′', '10′', '5′'], c: ['1°30′', '1°', '30′', '15′', '10′'], v: ['3°', '2°', '1°', '30′', '20′'] };
  const CLS = { f: 'f — точный', m: 'm — средний', c: 'c — грубый', v: 'v — очень грубый' };
  return { R, S, IT, SHAFT, HOLE, POPULAR, subIdx, devAt, calc, table, LIN, EDGE, ANG, CLS };
})();

ui.tol = { sys: 'gost', mode: 'fit', kind: 'hole', letter: 'H', grade: 7, size: '', cls: 'm', t25670: 14 };
try { const s = JSON.parse(localStorage.getItem('sc_tol') || 'null'); if (s) Object.assign(ui.tol, s); } catch (e) {}
const tolSave = () => { try { localStorage.setItem('sc_tol', JSON.stringify(ui.tol)); } catch (e) {} };
const mm3 = um => { const v = um / 1000; return v === 0 ? '0' : (v > 0 ? '+' : '−') + Math.abs(v).toFixed(4).replace(/0$/, '').replace('.', ','); };
const mmFix = v => (Math.round(v * 1000) / 1000).toFixed(3).replace('.', ',');
const rangeTxt = (lo, hi) => (lo === 0 ? 'до ' + hi : 'св. ' + String(lo).replace('.', ',') + ' до ' + String(hi).replace('.', ','));
const fieldName = t => t.letter + t.grade;
const seg = (act, cur, opts) => `<div class="seg">${opts.map(([v, l]) => `<div class="seg-i ${cur === v ? 'on' : ''}" data-act="${act}" data-v="${v}">${l}</div>`).join('')}</div>`;

function viewTol() {
  const t = ui.tol, gost = t.sys === 'gost';
  const top = header('Допуски и посадки', gost ? 'ГОСТ 25346/25347-2013' : 'ISO 286-1 / 286-2', false) +
    `<div class="ui-card">
      ${seg('tolSys', t.sys, [['gost', 'ГОСТ'], ['iso', 'ISO']])}
      ${seg('tolMode', t.mode, [['fit', 'Квалитеты (посадки)'], ['free', 'Свободные размеры']])}
    </div>`;
  return top + (t.mode === 'fit' ? viewTolFit() : viewTolFree());
}

function viewTolFit() {
  const t = ui.tol, gost = t.sys === 'gost';
  const letters = Object.keys(t.kind === 'hole' ? TOL.HOLE : TOL.SHAFT);
  const grades = (t.kind === 'hole' ? TOL.HOLE : TOL.SHAFT)[t.letter] || [];
  const D = num(t.size), fld = fieldName(t);
  const res = D > 0 && D <= 500 ? TOL.calc(t.kind, t.letter, t.grade, D) : null;
  const sizeBad = String(t.size).trim() !== '' && !(D > 0 && D <= 500);
  const tbl = TOL.table(t.kind, t.letter, t.grade);
  const result = res ? `<div class="ui-card tol-res">
      <div class="thr-title">Ø${String(D).replace('.', ',')} ${fld}</div>
      <div class="tol-dev"><span>${mm3(res.up)}</span><span>${mm3(res.lo)}</span></div>
      <div class="dim-grid" style="margin-top:10px"><div><small>мин</small>${mmFix(D + res.lo / 1000)}</div><div><small>сред.</small>${mmFix(D + (res.up + res.lo) / 2000)}</div><div><small>макс</small>${mmFix(D + res.up / 1000)}</div></div>
      <div class="kv mt"><span>Допуск IT${t.grade}</span><b>${mmFix(res.it / 1000)} мм (${res.it} мкм)</b></div>
      <div class="kv"><span>Интервал размеров</span><b>${rangeTxt(res.range[0], res.range[1])} мм</b></div>
    </div>` : '';
  return `<div class="ui-card">
      ${seg('tolKind', t.kind, [['hole', '◯ Отверстие'], ['shaft', '● Вал']])}
      <div class="input-group mt"><label>Номинальный размер, мм (необязательно, до 500)</label>
        <input type="text" inputmode="decimal" id="tol-size" value="${esc(t.size)}" placeholder="например 20"></div>
      ${sizeBad ? '<div class="muted" style="color:#C0392B">Размер должен быть больше 0 и не больше 500 мм.</div>' : ''}
      <div class="chips">${TOL.POPULAR[t.kind].map(f => `<span class="chip ${f === fld ? 'on' : ''}" data-act="tolField" data-f="${f}">${f}</span>`).join('')}</div>
      <div class="two-col mt">
        <div class="input-group"><label>Основное отклонение</label><select id="tol-letter">${letters.map(l => `<option ${l === t.letter ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
        <div class="input-group"><label>Квалитет</label><select id="tol-grade">${grades.map(g => `<option value="${g}" ${g === t.grade ? 'selected' : ''}>${g}</option>`).join('')}</select></div>
      </div>
    </div>
    ${result}
    <div class="ui-card">
      <div class="section-title">${fld} — ${t.kind === 'hole' ? 'отверстие' : 'вал'}, все интервалы</div>
      <table class="tol-tbl"><thead><tr><th>Размер, мм</th><th>Верхнее</th><th>Нижнее</th><th>IT, мкм</th></tr></thead><tbody>
      ${tbl.map(r => `<tr class="${res && r.sis.includes(res.si) ? 'hl' : ''}"><td>${rangeTxt(r.lo0, r.hi)}</td><td>${mm3(r.up)}</td><td>${mm3(r.lo)}</td><td>${r.it}</td></tr>`).join('')}
      </tbody></table>
      <div class="muted mt">Отклонения в мм. ${gost ? 'ГОСТ 25346-2013 и ГОСТ 25347-2013 идентичны ISO 286-1/286-2' : 'ISO 286-1/286-2 (в России — ГОСТ 25346/25347-2013, значения те же)'}.</div>
    </div>`;
}

function viewTolFree() {
  const t = ui.tol, gost = t.sys === 'gost', D = num(t.size);
  const pick = (tb, D) => tb.ranges.findIndex(([lo, hi], i) => (i === 0 ? D >= lo : D > lo) && D <= hi);
  const li = D > 0 ? pick(TOL.LIN, D) : -1, ei = D > 0 ? pick(TOL.EDGE, D) : -1;
  const pm = v => (v == null ? '—' : '±' + String(v).replace('.', ','));
  let res = '';
  if (D > 0) {
    const lin = li >= 0 ? TOL.LIN[t.cls][li] : null, edge = ei >= 0 ? TOL.EDGE[t.cls][ei] : null;
    res = `<div class="ui-card tol-res"><div class="thr-title">${String(D).replace('.', ',')} мм · класс ${t.cls}</div>
      <div class="kv mt"><span>Линейный размер</span><b>${lin == null ? 'не нормируется' : pm(lin) + ' → ' + mmFix(D - lin) + '…' + mmFix(D + lin)}</b></div>
      <div class="kv"><span>Фаска / радиус такого размера</span><b>${edge == null ? 'не нормируется' : pm(edge)}</b></div>`;
    if (gost) {
      const si = TOL.subIdx(D);
      if (si >= 0) {
        const it = TOL.devAt('hole', 'H', t.t25670, si).it;
        res += `<div class="kv"><span>По ГОСТ 25670 (IT${t.t25670}): отверстие H${t.t25670}</span><b>+${mmFix(it / 1000)} / 0</b></div>
          <div class="kv"><span>вал h${t.t25670}</span><b>0 / −${mmFix(it / 1000)}</b></div>
          <div class="kv"><span>прочие ±IT${t.t25670}/2</span><b>±${mmFix(it / 2000)}</b></div>`;
      }
    }
    res += '</div>';
  }
  const linRows = TOL.LIN.ranges.map(([lo, hi], i) => `<tr class="${i === li ? 'hl' : ''}"><td>${rangeTxt(lo === 0.5 ? 0.5 : lo, hi).replace('св. 0,5', 'от 0,5')}</td>${['f', 'm', 'c', 'v'].map(c => `<td class="${c === t.cls ? 'col-on' : ''}">${pm(TOL.LIN[c][i])}</td>`).join('')}</tr>`).join('');
  const edgeRows = TOL.EDGE.ranges.map(([lo, hi], i) => `<tr class="${i === ei ? 'hl' : ''}"><td>${hi === Infinity ? 'св. 6' : (i === 0 ? 'от 0,5 до 3' : 'св. 3 до 6')}</td>${['f', 'm', 'c', 'v'].map(c => `<td class="${c === t.cls ? 'col-on' : ''}">${pm(TOL.EDGE[c][i])}</td>`).join('')}</tr>`).join('');
  const angRows = TOL.ANG.ranges.map((r, i) => `<tr><td>${r}</td>${['f', 'm', 'c', 'v'].map(c => `<td class="${c === t.cls ? 'col-on' : ''}">±${TOL.ANG[c][i]}</td>`).join('')}</tr>`).join('');
  const head = `<thead><tr><th>Размер, мм</th><th>f</th><th>m</th><th>c</th><th>v</th></tr></thead>`;
  let g25670 = '';
  if (gost) {
    const its = [12, 14, 16, 17];
    const rowsIT = TOL.R.map(([lo, hi], ri) => { const it = TOL.IT[ri][t.t25670 - 1]; return `<tr><td>${rangeTxt(lo, hi)}</td><td>+${mmFix(it / 1000)}</td><td>−${mmFix(it / 1000)}</td><td>±${mmFix(it / 2000)}</td></tr>`; }).join('');
    g25670 = `<div class="ui-card"><div class="section-title">ГОСТ 25670-83: «H${t.t25670}, h${t.t25670}, ±IT${t.t25670}/2»</div>
      ${seg('tol25670', String(t.t25670), its.map(i => [String(i), 'IT' + i]))}
      <table class="tol-tbl mt"><thead><tr><th>Размер, мм</th><th>H (отв.)</th><th>h (вал)</th><th>±IT/2</th></tr></thead><tbody>${rowsIT}</tbody></table>
      <div class="muted mt">Старая, но распространённая запись на чертежах: «Неуказанные предельные отклонения размеров: H14, h14, ±IT14/2». Стандарт отменён, его заменил ГОСТ 30893.1.</div></div>`;
  }
  return `<div class="ui-card">
      <div class="section-title">${gost ? 'ГОСТ 30893.1-2002 (ИСО 2768-1)' : 'ISO 2768-1'} — общие допуски</div>
      ${seg('tolCls', t.cls, Object.keys(TOL.CLS).map(c => [c, c]))}
      <div class="muted" style="margin-top:6px">${TOL.CLS[t.cls]}. На чертеже: «${gost ? 'Общие допуски по ГОСТ 30893.1 — ' + t.cls : 'ISO 2768-' + t.cls}».</div>
      <div class="input-group mt"><label>Размер, мм (необязательно)</label><input type="text" inputmode="decimal" id="tol-size" value="${esc(t.size)}" placeholder="например 45"></div>
    </div>
    ${res}
    <div class="ui-card"><div class="section-title">Линейные размеры, мм</div><table class="tol-tbl">${head}<tbody>${linRows}</tbody></table></div>
    <div class="ui-card"><div class="section-title">Фаски и радиусы (притупления кромок), мм</div><table class="tol-tbl">${head}<tbody>${edgeRows}</tbody></table></div>
    <div class="ui-card"><div class="section-title">Угловые размеры (по меньшей стороне угла, мм)</div><table class="tol-tbl">${head.replace('Размер, мм', 'Длина, мм')}<tbody>${angRows}</tbody></table></div>
    ${g25670}`;
}

Object.assign(Actions, {
  tolSys(d) { ui.tol.sys = d.v; tolSave(); rerender(); },
  tolMode(d) { ui.tol.mode = d.v; tolSave(); rerender(); },
  tolKind(d) {
    const t = ui.tol; if (t.kind === d.v) return;
    t.kind = d.v;
    const map = t.kind === 'hole' ? TOL.HOLE : TOL.SHAFT;
    const L = t.kind === 'hole' ? t.letter.toUpperCase() : t.letter.toLowerCase();
    t.letter = map[L] ? L : (t.kind === 'hole' ? 'H' : 'h');
    if (!map[t.letter].includes(t.grade)) t.grade = map[t.letter][0];
    tolSave(); rerender();
  },
  tolField(d) {
    const m = /^([A-Za-z]+)(\d+)$/.exec(d.f); if (!m) return;
    ui.tol.letter = m[1]; ui.tol.grade = +m[2]; tolSave(); rerender();
  },
  tolCls(d) { ui.tol.cls = d.v; tolSave(); rerender(); },
  tol25670(d) { ui.tol.t25670 = +d.v; tolSave(); rerender(); }
});
document.addEventListener('change', e => {
  const id = e.target.id, t = ui.tol;
  if (id === 'tol-letter') {
    t.letter = e.target.value;
    const gr = (t.kind === 'hole' ? TOL.HOLE : TOL.SHAFT)[t.letter];
    if (!gr.includes(t.grade)) t.grade = gr.includes(7) ? 7 : gr[0];
    tolSave(); rerender();
  } else if (id === 'tol-grade') { t.grade = +e.target.value; tolSave(); rerender(); }
  else if (id === 'tol-size') { tolSave(); rerender(); }
});
let tolTimer = null;
document.addEventListener('input', e => {
  if (e.target.id !== 'tol-size') return;
  ui.tol.size = e.target.value;
  clearTimeout(tolTimer);
  tolTimer = setTimeout(() => {               // пересчёт без потери фокуса
    const el = document.getElementById('tol-size'), pos = el ? el.selectionStart : null;
    tolSave(); rerender();
    const n = document.getElementById('tol-size');
    if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (er) {} }
  }, 250);
});

/* =====================================================================
   ИСТОРИЯ ДЕТАЛЕЙ (архив партий)
   При переналадке с ответом «Партия окончена — да» текущая деталь со всеми
   параметрами наладки, программой, чертежом и итогами уходит в архив,
   а станок готовится к новой партии. Из архива можно «Наладить повторно».
   ===================================================================== */
const batchesOf = m => Object.values(db.batches).filter(b => b.machine_id === m.id).sort((a, b) => (a.finished_at < b.finished_at ? 1 : -1));
const batchImg = {};                       // чертежи архива (в памяти, грузятся при просмотре)
/* начало текущей партии по первой записи выработки (для старых партий без отметки начала) */
function batchFirstDay(m) {
  let first = null;
  for (const [day, arr] of Object.entries(m.shifts || {})) if (arr.some(e => inBatch(m, e) && num(e.count) > 0) && (!first || day < first)) first = day;
  return first ? first + 'T00:00:00' : null;
}
const dmy = iso => { if (!iso) return '—'; const d = new Date(iso); return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + String(d.getFullYear()).slice(2); };

/* окно с несколькими кнопками-вариантами */
function choice(title, html, buttons) {
  const w = document.createElement('div');
  w.className = 'modal-bg';
  w.innerHTML = `<div class="modal"><h3>${esc(title)}</h3><div class="muted" style="font-size:14px;color:#4A5660">${html}</div>
    ${buttons.map(([label, cls], i) => `<button class="action-button ${cls} mt" data-ch="${i}">${esc(label)}</button>`).join('')}</div>`;
  w.addEventListener('click', e => {
    const bt = e.target.closest('[data-ch]');
    if (e.target === w) return w.remove();
    if (!bt) return;
    w.remove();
    const fn = buttons[+bt.dataset.ch][2];
    if (fn) fn();
  });
  document.body.appendChild(w);
}

async function machineDrawingImage(m) {
  if (m.drawing) return m.drawing;
  if (!m.hasDrawing || !Sync.enabled || !SAFE_ID.test(m.id)) return null;
  try { const r = await rest('drawings?machine_id=eq.' + m.id + '&select=image'); return r && r[0] ? r[0].image : null; } catch (e) { return null; }
}
async function batchDrawingImage(b) {
  if (batchImg[b.id]) return batchImg[b.id];
  if (b.drawing) return b.drawing;                                     // локальный режим
  if (!Sync.enabled || !SAFE_ID.test(b.id)) return null;
  try { const r = await rest('batches?id=eq.' + b.id + '&select=drawing'); const img = r && r[0] ? r[0].drawing : null; if (img) batchImg[b.id] = img; return img; } catch (e) { return null; }
}

/* текущая деталь → в архив, станок → к новой партии */
/* снимок партии: параметры наладки + итоги (для архива и для отчёта по текущей партии) */
function batchSnapshot(m, endIso) {
  const per = {}, perN = {}, days = [];
  for (const [day, arr] of Object.entries(m.shifts || {})) for (const e of arr) {
    if (!inBatch(m, e)) continue;
    const w = e.who || '—';
    per[w] = (per[w] || 0) + num(e.count);
    if (num(e.count) > 0) { perN[w] = (perN[w] || 0) + 1; days.push(day); }
  }
  days.sort();
  const start = m.batchStart || (days[0] ? days[0] + 'T00:00:00' : null);
  const from = start ? new Date(start).toISOString() : null;
  const changes = (m.changes || []).filter(c => !from || c.ts >= from).map(c => Object.assign({}, c));
  return {
    name: m.part.name, len: m.part.len, qty: m.part.qty, done: doneOf(m), dia: m.bar.dia,
    collets: Object.assign({}, m.collets), cutW: m.cutW, cycle: m.cycle, eff: m.eff, barCfg: Object.assign({}, m.barCfg),
    tools: (m.tools || []).map(t => ({ code: t.code, name: t.name, spec: t.spec })),
    program: Object.assign({}, m.program), hasDrawing: !!(m.drawing || m.hasDrawing), start, end: endIso, per, perN, changes,
    machineNum: m.num, model: m.model, batchId: m.batchId || null, by: user
  };
}
/* расход материала на партию: детали + огарки (как в калькуляторе прутка) */
function batchMaterial(d) {
  const bc = d.barCfg || {}, perPart = num(d.len) + num(d.cutW) + num(bc.face);
  const parts = num(d.done) * perPart, usable = num(bc.barLen) * 1000 - num(bc.remnant);
  const exact = usable > 0 ? parts / usable : 0;
  return { perPart, parts, rem: exact * num(bc.remnant), all: parts + exact * num(bc.remnant), bars: Math.ceil(exact - 1e-9) };
}

async function archiveCurrent(m) {
  const now = new Date().toISOString();
  const img = await machineDrawingImage(m);
  const data = batchSnapshot(m, now);
  data.hasDrawing = !!img;
  const b = { id: uid(), machine_id: m.id, data, finished_at: now };
  if (!Sync.enabled && img) b.drawing = img;
  db.batches[b.id] = b;
  // новая партия: сбрасываем параметры детали, программу, чертёж и счётчик
  m.part = { name: '', len: 0, qty: 0 };
  m.cycle = 0;
  m.program = { name: '', notes: '', code: '' };
  const hadDrawing = !!(m.drawing || m.hasDrawing);
  m.drawing = null; m.hasDrawing = false; m.drawingV = Date.now();
  m.batchId = uid(); m.batchStart = now;
  save();
  if (Sync.enabled) {
    try {
      await flushNow();
      if (img) await rest('batches?id=eq.' + b.id, { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: { drawing: img } });
    } catch (e) { alert('Деталь в архиве, но чертёж не сохранился на сервере: ' + e.message); }
    if (hadDrawing) Sync.delDrawing(m.id);
  }
  return b;
}

/* параметры детали из архива → на станок (инструкция для наладки) */
async function applyBatch(m, b) {
  const d = b.data;
  m.part = { name: d.name || '', len: num(d.len), qty: num(d.qty) };
  m.bar.dia = num(d.dia);
  m.collets = Object.assign({ main: '', back: '' }, d.collets || {});
  m.cutW = num(d.cutW); m.cycle = num(d.cycle); m.eff = num(d.eff) || 85;
  m.barCfg = Object.assign({ face: 0.5, barLen: 3, remnant: 300 }, d.barCfg || {});
  m.tools = (d.tools || []).map(t => ({ id: uid(), code: t.code, name: t.name, spec: t.spec }));
  m.program = Object.assign({ name: '', notes: '', code: '' }, d.program || {});
  if (!m.batchStart) m.batchStart = batchFirstDay(m) || new Date().toISOString();
  let img = null;
  if (d.hasDrawing) img = await batchDrawingImage(b);
  m.drawing = img; m.hasDrawing = !!img; m.drawingV = Date.now();
  save();
  if (img) Sync.putDrawing(m.id, img);
}

      <div class="section-title mt">📏 Материал${d.dia ? ' · пруток Ø' + esc(d.dia) + ' мм' : ''}</div>
      ${kv('Ушло на партию (с огарками)', fmtNum(mat.all / 1000) + ' м')}
      ${kv('Прутков по ' + fmtNum(num((d.barCfg || {}).barLen)) + ' м', '≈ ' + mat.bars + ' шт')}
      ${kv('На детали / огарки', fmtNum(mat.parts / 1000) + ' м / ' + fmtNum(mat.rem / 1000) + ' м')}

      <div class="muted mt" style="font-size:12px">Материал — расчётный: сделано × (длина + отрезной + торец) плюс огарки по параметрам прутка.</div>

Object.assign(views, { history: viewHistory, batch: viewBatch, allHistory: viewAllHistory });

Object.assign(Actions, {
  batchOpen(d) { if (d.mid) ui.mid = d.mid; ui.batchFrom = d.from || 'machine'; ui.bid = d.id; ui.view = 'batch'; render(); },
  allHistory() { ui.view = 'allHistory'; render(); },
  batchDrawView() {
    const b = db.batches[ui.bid], img = b && (batchImg[b.id] || b.drawing); if (!img) return;
    const w = document.createElement('div'); w.className = 'fullscreen'; w.innerHTML = `<img src="${img}">`; w.onclick = () => w.remove(); document.body.appendChild(w);
  },
  batchReuse(d) {
    const m = curM(), b = db.batches[d.id]; if (!m || !b) return;
    const go = async () => {
      await applyBatch(m, b);
      ui.view = 'machine'; render();
      setTimeout(() => alert(`Станок настроен на деталь «${b.data.name}». Проверьте параметры, инструмент, программу и чертёж — это инструкция для наладки.`), 50);
    };
    const busy = !!m.part.name || doneOf(m) > 0;
    if (!busy) return choice('Наладить повторно?', `На станок будут установлены все параметры детали «${esc(b.data.name)}».`, [['Наладить', 'orange', go], ['Отмена', 'secondary', null]]);
    choice('На станке другая деталь', `Сейчас на станке «${esc(m.part.name || 'без названия')}» (сделано ${fmtNum(doneOf(m), 0)} шт). Она уйдёт в архив, затем станок будет налажен на «${esc(b.data.name)}».`, [
      ['В архив и наладить повторно', 'orange', async () => { await archiveCurrent(m); await go(); }],
      ['Отмена', 'secondary', null]
    ]);
  },
  batchDel(d) {
    const b = db.batches[d.id]; if (!b) return;
    if (!confirm(`Удалить «${b.data.name}» из архива? Это нельзя отменить.`)) return;
    delete db.batches[d.id]; save(); ui.view = 'history'; render();
  }
});

    <div class="muted">${esc(a.name)} · ${(ROLES[a.want] || {}).label || ''}<br><br>Как только администратор подтвердит заявку, приложение откроется само.</div>
    <button class="action-button secondary mt" data-act="accCheck">Проверить</button>`);
  return card('<div class="access-ico">⛔</div><div class="card-title">Доступ закрыт</div><div class="muted">Обратитесь к администратору.</div>');
}

function adminBanner() {
  if (Sync.enabled && Sync.noV4 && isOwner()) return '<div class="ui-card"><div class="warn-box" style="margin:0">🔐 Чтобы включить заявки, роли и архив деталей, выполните один раз <b>setup4.sql</b> в Supabase (SQL Editor). До этого все, кроме вас, работают как операторы.</div></div>';
  if (!can('users') || !usersOn()) return '';
  const pend = Object.values(db.users).filter(u => u.role === 'pending').length;
  return `<div class="ui-card users-banner" data-act="usersOpen"><span>👥 Пользователи и роли</span>${pend ? `<b class="pend-badge">${pend} ${pend === 1 ? 'заявка' : pend < 5 ? 'заявки' : 'заявок'}</b>` : '<span class="muted">›</span>'}</div>`;
}

function viewUsers() {
  const all = Object.values(db.users).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ru'));
  const pend = all.filter(u => u.role === 'pending'), rest_ = all.filter(u => u.role !== 'pending');
  const opts = (sel, withBlock) => ROLE_CHOICES.map(r => `<option value="${r}" ${r === sel ? 'selected' : ''}>${ROLES[r].ico} ${ROLES[r].label}</option>`).join('') +
    (withBlock ? `<option value="blocked" ${sel === 'blocked' ? 'selected' : ''}>⛔ Заблокирован</option>` : '');
  return header('Пользователи', 'Заявки и роли', true) +
    `<div class="ui-card"><div class="section-title">Заявки${pend.length ? ' · ' + pend.length : ''}</div>
      ${pend.map(u => `<div class="user-row">
        <div><b>${esc(u.name)}</b><div class="muted">хочет: ${(ROLES[u.want] || {}).label || '—'} · ${dmy(u.created_at)}</div></div>
        <div class="input-group" style="margin:8px 0"><select id="uacc-${u.id}">${opts(ROLES[u.want] && u.want !== 'admin' ? u.want : 'operator', false)}</select></div>
        <div class="two-col"><button class="action-button" data-act="userAccept" data-id="${u.id}">Принять</button><button class="action-button secondary" style="color:#C0392B" data-act="userReject" data-id="${u.id}">Отклонить</button></div>
      </div>`).join('') || '<div class="empty">Новых заявок нет</div>'}</div>
    <div class="ui-card"><div class="section-title">Пользователи · ${rest_.length + 1}</div>
      <div class="user-row"><div><b>${esc(user)} (вы)</b><div class="muted">🔑 Админ — полный доступ</div></div></div>
      ${rest_.map(u => `<div class="user-row">
        <div class="user-head"><b>${esc(u.name)}</b><button class="mini-btn danger" data-act="userDel" data-id="${u.id}">✕</button></div>
        <div class="input-group" style="margin:6px 0 0"><select id="urole-${u.id}">${opts(u.role, true)}</select></div>
      </div>`).join('')}
      <div class="muted mt">Роль меняется сразу. Удалённый пользователь при следующем входе снова сможет подать заявку; заблокированный — нет.</div></div>
    <div class="ui-card"><div class="section-title">Что может каждая роль</div>
      <div class="kv"><span>🔧 Наладчик</span><b>наладка, архив, график, явка</b></div>
      <div class="kv"><span>👷 Оператор</span><b>выработка, замены, отметка</b></div>
      <div class="kv"><span>📊 Руководство</span><b>станки, график, явка (просмотр)</b></div>
      <div class="kv"><span>🔍 ОТК</span><b>детали, чертежи, резьбы, допуски</b></div></div>`;
}

Object.assign(Actions, {
  accReq() {
    const id = tgId(); if (id == null) return;
    const name = (document.getElementById('acc-name') || {}).value || '';
    if (!name.trim()) return alert('Введите фамилию и имя');
    const want = (document.getElementById('acc-want') || {}).value || 'operator';
    db.users[String(id)] = { id: String(id), tg_id: id, name: name.trim(), role: 'pending', want, created_at: new Date().toISOString() };
    user = name.trim(); try { localStorage.setItem('sc_user', user); } catch (e) {}
    save(); render();
  },
  accCheck() { syncTick(true); },
  usersOpen() { ui.usersOpen = true; render(); },
  userAccept(d) {
    const u = db.users[d.id]; if (!u) return;
    const sel = document.getElementById('uacc-' + d.id);
    u.role = sel && ROLE_CHOICES.includes(sel.value) ? sel.value : 'operator';
    save(); rerender();
  },
  userReject(d) { if (db.users[d.id] && confirm('Отклонить заявку?')) { delete db.users[d.id]; save(); rerender(); } },
  userDel(d) { const u = db.users[d.id]; if (u && confirm(`Удалить пользователя «${u.name}»? Он потеряет доступ.`)) { delete db.users[d.id]; save(); rerender(); } }
});
needPerm('users', ['usersOpen', 'userAccept', 'userReject', 'userDel']);
document.addEventListener('change', e => {
  const m = /^urole-(.+)$/.exec(e.target.id || '');
  if (!m || !can('users')) return;
  const u = db.users[m[1]]; if (!u) return;
  const v = e.target.value;
  if (ROLE_CHOICES.includes(v) || v === 'blocked') { u.role = v; save(); rerender(); }
});

/* ===================== СТАРТ ===================== */
render();
if (!user) setTimeout(() => Actions.setName(), 300);
if (Sync.enabled) Sync.boot();
</script>
</body>
</html>
