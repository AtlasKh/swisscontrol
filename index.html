<style>

/* календарь */

.draw-img { width: 100%; border-radius: 14px; border: 1px solid #DCE3EB; display: block; }

.result-box { background: #FDF1E7; border: 1px solid #F2CDAE; border-radius: 16px; padding: 14px; margin-top: 6px; }

<body>
<div id="app"></div>

<script>
/* ===================== УТИЛИТЫ ===================== */
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };
const pad = n => String(n).padStart(2, '0');
const isoDate = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const fmtDT = iso => new Date(iso).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
const fmtNum = (n, d = 2) => (Math.round(n * Math.pow(10, d)) / Math.pow(10, d)).toString().replace('.', ',');

/* ===================== ПОДКЛЮЧЕНИЕ К БАЗЕ (Supabase) =====================
   Вставьте сюда два значения из Supabase (Project URL и publishable key).
   Пока они пустые, приложение работает в локальном режиме:
   данные хранятся только на этом телефоне. */
const SUPABASE_URL = 'https://rxjvsjpigsryxjrbfujr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_F0JlRlRMDnho42UH18YO5g_bEwxOpgS';
const CLOUD = !!(SUPABASE_URL && SUPABASE_KEY);

/* ===================== ЛОКАЛЬНЫЙ КЭШ =====================
   В облачном режиме тут лежит только копия данных (без чертежей),
   главная база находится в Supabase (см. блок «ОБЛАКО» ниже). */
const KEY = 'swisscontrol_v1';
const Store = {
  load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } },
  save(data) {
    try { localStorage.setItem(KEY, JSON.stringify(data, CLOUD ? (k, v) => (k === 'drawing' ? undefined : v) : undefined)); }
    catch (e) { alert('Не хватает памяти для сохранения. Удалите чертёж или уменьшите изображения.'); }
  }
};

function newMachine(num_, model) {
  return {
    id: uid(), num: num_, model: model || '',
    part: { name: '', len: 0, qty: 0 },
    bar: { dia: 0 },
    collets: { main: '', back: '' },
    cutW: 3, cycle: 0, eff: 85,
    barCfg: { face: 0.5, barLen: 3, remnant: 300 },
    tools: [], changes: [],
    program: { name: '', notes: '', code: '' },
    drawing: null,
    shifts: {}
  };
}

function seedData() {
  const m = newMachine('01', 'Citizen L20');
  m.part = { name: 'Вал-шестерня', len: 23.8, qty: 1500 };
  m.bar.dia = 18;
  m.collets = { main: '18М', back: '14B' };
  m.tools = [
    { id: uid(), code: 'T01', name: 'Проходной резец', spec: 'Пластина ромб CCGT' },
    { id: uid(), code: 'T02', name: 'Отрезной резец', spec: 'Ширина 3.0 мм' },
    { id: uid(), code: 'T03', name: 'Сверло монолит', spec: 'Ø 5.5 мм (Main)' }
  ];
  return { machines: [m] };
}

let db = Store.load() || seedData();
/* ===================== ОБЛАКО (Supabase) =====================
   Как это работает: весь остальной код по-прежнему меняет объект db и
   вызывает save(). Слой ниже сам сравнивает db с тем, что уже лежит на
   сервере, и отправляет только изменившиеся строки. Каждые 12 секунд
   (и при возврате в приложение) подтягиваются изменения других людей. */
const Sync = { enabled: CLOUD, ready: false, busy: false, again: false, dirty: false, queued: false,
  online: true, error: null, snap: { m: {}, e: {}, c: {} }, loading: {}, t: null, started: false };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const SAFE_ID = /^[A-Za-z0-9_-]+$/;

async function rest(path, opts = {}) {
  const h = Object.assign({ apikey: SUPABASE_KEY, 'Content-Type': 'application/json' }, opts.headers || {});
  if (SUPABASE_KEY.startsWith('eyJ')) h.Authorization = 'Bearer ' + SUPABASE_KEY; // старый (legacy) ключ
  const r = await fetch(SUPABASE_URL.replace(/\/+$/, '') + '/rest/v1/' + path, {
    method: opts.method || 'GET', headers: h, body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  const text = await r.text();
  if (!r.ok) throw new Error(r.status + ' ' + text.slice(0, 200));
  return text ? JSON.parse(text) : null;
}
async function restAll(path) {            // сервер отдаёт максимум 1000 строк за раз
  const out = [], sep = path.includes('?') ? '&' : '?';
  for (let off = 0; ; off += 1000) {
    const part = await rest(path + sep + 'limit=1000&offset=' + off);
    for (const row of part) out.push(row);
    if (part.length < 1000) break;
  }
  return out;
}

/* db -> строки таблиц */
function toRows(d) {
  const rows = { m: {}, e: {}, c: {} };
  for (const m of d.machines) {
    const { drawing, shifts, changes, ...data } = m;
    data.hasDrawing = !!(drawing || m.hasDrawing);
    rows.m[m.id] = { id: m.id, data };
    for (const [day, arr] of Object.entries(m.shifts || {})) for (const e of arr)
      rows.e[e.id] = { id: e.id, machine_id: m.id, day, shift: shiftOf(e), who: e.who || '—', count: Math.round(num(e.count)) };
    for (const c of (m.changes || []))
      rows.c[c.id] = { id: c.id, machine_id: m.id, ts: c.ts, who: c.who || null, code: c.code || null, tool: c.tool || null, reason: c.reason || null, spec: c.spec || null, comment: c.comment || null };
  }
  return rows;
}
function serialize(rows) {
  const s = { m: {}, e: {}, c: {} };
  for (const k of ['m', 'e', 'c']) for (const id in rows[k]) s[k][id] = JSON.stringify(rows[k][id]);
  return s;
}

function setOnline(ok, msg) {
  const changed = Sync.online !== ok;
  Sync.online = ok; Sync.error = ok ? null : msg;
  const a = document.activeElement;
  if (changed && Sync.ready && !document.querySelector('.modal-bg') && !(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName))) rerender();
}

/* отправка изменений на сервер */
async function syncPush() {
  if (!Sync.enabled || !Sync.ready) return;
  Sync.queued = false;
  if (Sync.busy) { Sync.again = true; return; }
  Sync.busy = true;
  try {
    do {
      Sync.again = false;
      const rows = toRows(db), ser = serialize(rows);
      const changed = k => Object.keys(rows[k]).filter(id => Sync.snap[k][id] !== ser[k][id]).map(id => rows[k][id]);
      const removed = k => Object.keys(Sync.snap[k]).filter(id => !(id in rows[k]) && SAFE_ID.test(id));
      const up = (table, arr) => rest(table + '?on_conflict=id', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: arr });
      const del = (table, ids) => rest(table + '?id=in.(' + ids.join(',') + ')', { method: 'DELETE' });
      const cm = changed('m'), ce = changed('e'), cc = changed('c');
      if (cm.length) await up('machines', cm);              // станки раньше записей (связь по ключу)
      if (ce.length) await up('shift_entries', ce);
      if (cc.length) await up('tool_changes', cc);
      const de = removed('e'), dm = removed('m');
      if (de.length) await del('shift_entries', de);
      if (dm.length) await del('machines', dm);
      Sync.snap = ser;
    } while (Sync.again);
    Sync.dirty = Sync.queued;
    setOnline(true);
  } catch (e) {
    Sync.dirty = true;
    setOnline(false, e.message);
    clearTimeout(Sync.t); Sync.t = setTimeout(syncPush, 8000);   // повторим позже
  }
  Sync.busy = false;
}
async function flushNow() {
  clearTimeout(Sync.t);
  while (Sync.busy) await sleep(100);
  await syncPush();
}

function save() {
  Store.save(db);
  if (Sync.enabled && Sync.ready) {
    Sync.dirty = true; Sync.queued = true;
    clearTimeout(Sync.t); Sync.t = setTimeout(syncPush, 300);
  }
}

/* получение данных с сервера. Возвращает true, если что-то изменилось */
async function syncPull(first) {
  const [ms, es, cs] = await Promise.all([
    restAll('machines?select=id,data&order=id'),
    restAll('shift_entries?select=id,machine_id,day,shift,who,count&order=id'),
    restAll('tool_changes?select=*&order=id')
  ]);
  if (!ms.length && first) {                       // сервер пуст: первый админ загружает то, что есть на телефоне
    if (isAdmin()) {
      Sync.ready = true;
      for (const m of db.machines) if (m.drawing) { m.hasDrawing = true; m.drawingV = m.drawingV || Date.now(); }
      await syncPush();
      if (!Sync.online) throw new Error(Sync.error || 'не удалось загрузить данные');
      for (const m of db.machines) if (m.drawing) await Sync.putDrawing(m.id, m.drawing);
      return true;
    }
    db = { machines: [] }; Store.save(db); Sync.snap = { m: {}, e: {}, c: {} };
    return true;
  }
  if (Sync.dirty || Sync.busy || Sync.queued) return false;   // у нас есть неотправленные правки — не затираем
  const old = {};
  db.machines.forEach(m => { old[m.id] = m; });
  const byId = {};
  const machines = ms.map(r => {
    const m = Object.assign(newMachine('', ''), r.data, { id: r.id });
    m.shifts = {}; m.changes = []; m.drawing = null;
    const o = old[r.id];
    if (o && o.drawing && m.hasDrawing && o.drawingV === m.drawingV) m.drawing = o.drawing;   // чертёж не менялся
    else delete Sync.loading[r.id];
    byId[r.id] = m; return m;
  });
  for (const e of es) {
    const m = byId[e.machine_id]; if (!m) continue;
    (m.shifts[e.day] = m.shifts[e.day] || []).push({ id: e.id, who: e.who, shift: e.shift, count: e.count });
  }
  for (const c of cs) {
    const m = byId[c.machine_id];
    if (m) m.changes.push({ id: c.id, ts: c.ts, who: c.who, code: c.code, tool: c.tool, reason: c.reason, spec: c.spec, comment: c.comment });
  }
  machines.forEach(m => m.changes.sort((a, b) => new Date(a.ts) - new Date(b.ts)));
  machines.sort((a, b) => String(a.num).localeCompare(String(b.num), 'ru', { numeric: true }));
  const strip = (k, v) => (k === 'drawing' ? undefined : v);
  const before = JSON.stringify(db, strip);
  db = { machines };
  const after = JSON.stringify(db, strip);
  Sync.snap = serialize(toRows(db));
  Store.save(db);
  if (ui.mid && !machines.find(m => m.id === ui.mid)) { ui.mid = null; ui.view = 'list'; }
  return before !== after;
}

async function syncTick(force) {
  if (!Sync.enabled || !Sync.ready || Sync.busy || Sync.dirty || Sync.queued) return;
  const a = document.activeElement;
  if (!force && (document.querySelector('.modal-bg') || (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)))) return;
  try {
    const changed = await syncPull(false);
    setOnline(true);
    if (changed && !document.querySelector('.modal-bg')) rerender();
  } catch (e) { setOnline(false, e.message); }
}

Sync.boot = async function () {
  try {
    await syncPull(true);
    Sync.ready = true; Sync.error = null; Sync.online = true;
    render();
    if (!Sync.started) {
      Sync.started = true;
      setInterval(() => syncTick(), 12000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) syncTick(true); });
      window.addEventListener('focus', () => syncTick(true));
    }
  } catch (e) { Sync.ready = false; Sync.error = e.message; render(); }
};

/* чертежи хранятся отдельно (они тяжёлые) и подгружаются при открытии */
Sync.putDrawing = async function (id, image) {
  if (!Sync.enabled) return;
  try {
    await flushNow();
    await rest('drawings?on_conflict=machine_id', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: [{ machine_id: id, image }] });
  } catch (e) { alert('Не удалось сохранить чертёж на сервере: ' + e.message); }
};
Sync.delDrawing = async function (id) {
  if (!Sync.enabled || !SAFE_ID.test(id)) return;
  try { await flushNow(); await rest('drawings?machine_id=eq.' + id, { method: 'DELETE' }); } catch (e) { setOnline(false, e.message); }
};
Sync.loadDrawing = async function (id) {
  if (Sync.loading[id] || !SAFE_ID.test(id)) return;
  Sync.loading[id] = true;
  try {
    const r = await rest('drawings?machine_id=eq.' + id + '&select=image');
    const m = db.machines.find(x => x.id === id);
    if (m && r && r[0]) { m.drawing = r[0].image; if (ui.view === 'drawing' && ui.mid === id) rerender(); }
  } catch (e) { delete Sync.loading[id]; }
};

function gateView() {
  if (!Sync.enabled || Sync.ready) return null;
  if (Sync.error) return header('SwissControl', 'Нет связи с сервером', false) +
    `<div class="ui-card"><div class="card-title">⚠️ Не удалось загрузить данные</div>
      <div class="muted">Проверьте интернет и попробуйте ещё раз.</div>
      <div class="muted mt" style="word-break:break-all">${esc(Sync.error)}</div>
      <button class="action-button mt" data-act="syncRetry">Повторить</button></div>`;
  return header('SwissControl', 'Загрузка данных…', false) +
    '<div class="ui-card"><div class="empty">⏳ Загружаем данные с сервера…</div></div>';
}

  const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (u) return [u.first_name, u.last_name].filter(Boolean).join(' ');
  return localStorage.getItem('sc_user') || '';
}
let user = getUser();

/* ===================== РОЛИ =====================
   admin    — наладчик/администратор: может всё.
   operator — оператор: видит всё, но может только вносить свою выработку
              и отмечать замену инструмента.
   ВАЖНО: пока нет сервера, защита работает на уровне интерфейса (кнопки
   скрыты и заблокированы). Для настоящей защиты права нужно проверять на
   сервере по подписи Telegram (initData). */
const ADMIN_IDS = [381731875, 386039399];   // Telegram ID наладчиков/админов. Новый админ: добавить ID через запятую
const tgId = () => { const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user; return u ? u.id : null; };
const isAdmin = () => tgId() !== null && ADMIN_IDS.includes(tgId());
const ADMIN_ONLY = ['addMachine', 'editMachine', 'toolAdd', 'toolEdit', 'progEdit', 'drawPick', 'drawDel'];

const ui = { view: 'list', mid: null, month: new Date(), day: null };
const curM = () => db.machines.find(m => m.id === ui.mid);
const doneOf = m => Object.values(m.shifts).reduce((s, arr) => s + arr.reduce((a, e) => a + num(e.count), 0), 0);
/* Смены: день 06:00–18:00, ночь 18:00–06:00.
   Ночная смена записывается на дату, когда она НАЧАЛАСЬ
   (в 03:00 30-го числа идёт ночь от 29-го). */
const SHIFT_NAMES = { day: '☀️ День', night: '🌙 Ночь' };
const DAY_START = 6, NIGHT_START = 18, SHIFT_HOURS = 12;
const hh = h => String(h).padStart(2, '0') + ':00';
function currentShift() {
  const now = new Date(), h = now.getHours();
  const d = new Date(now);
  let type = 'day';
  if (h >= NIGHT_START) type = 'night';
  else if (h < DAY_START) { type = 'night'; d.setDate(d.getDate() - 1); }
  return { date: isoDate(d), type };
}
const shiftOf = e => e.shift === 'night' ? 'night' : 'day'; // старые записи = день
const todayEntry = (m, create) => {
  const cs = currentShift();
  const arr = m.shifts[cs.date] || (create ? (m.shifts[cs.date] = []) : []);
  let e = arr.find(x => x.who === user && shiftOf(x) === cs.type);
  if (!e && create) { e = { id: uid(), who: user, shift: cs.type, count: 0 }; arr.push(e); }
  return e;
};

/* ===================== МОДАЛЬНОЕ ОКНО ===================== */
function modal(title, fields, onSave, onDelete) {
  const w = document.createElement('div');
  w.className = 'modal-bg';
  const fieldHtml = f => {
    const v = f.value == null ? '' : f.value;
    let input;
    if (f.type === 'select') input = `<select name="${f.k}">${f.options.map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    else if (f.type === 'textarea') input = `<textarea name="${f.k}" rows="${f.rows || 4}">${esc(v)}</textarea>`;
    else input = `<input name="${f.k}" type="text" ${f.type === 'number' ? 'inputmode="decimal"' : ''} value="${esc(v)}" placeholder="${esc(f.ph || '')}">`;
    return `<div class="input-group"><label>${esc(f.label)}</label>${input}</div>`;
  };
  w.innerHTML = `<div class="modal"><h3>${esc(title)}</h3>${fields.map(fieldHtml).join('')}
    <div class="row"><button class="action-button secondary" data-m="x">Отмена</button><button class="action-button" data-m="ok">Сохранить</button></div>
    ${onDelete ? '<button class="action-button secondary mt" style="color:#C0392B" data-m="del">Удалить</button>' : ''}</div>`;
  w.addEventListener('click', e => {
    const b = e.target.closest('[data-m]');
    if (e.target === w || (b && b.dataset.m === 'x')) return w.remove();
    if (!b) return;
    if (b.dataset.m === 'del') { if (confirm('Удалить?')) { onDelete(); w.remove(); } return; }
    if (b.dataset.m === 'ok') {
      const out = {};
      fields.forEach(f => { out[f.k] = w.querySelector(`[name="${f.k}"]`).value.trim(); });
      if (onSave(out) !== false) w.remove();
    }
  });
  document.body.appendChild(w);
  const first = w.querySelector('input,textarea');
  if (first) setTimeout(() => first.focus(), 50);
}

/* ===================== ПРОГНОЗ ПО ПАРТИИ =====================
   Теория: из времени цикла и загрузки станка считаем производительность.
   Факт: среднее по уже внесённым записям смен (текущая, ещё не закрытая смена не учитывается). */
const fmtDur = hours => {
  if (!isFinite(hours)) return '—';
  const totalH = Math.max(0, Math.round(hours));
  const d = Math.floor(totalH / 24), h = totalH % 24;
  return (d ? d + ' дн ' : '') + h + ' ч';
};
function factPerShift(m) {
  const cs = currentShift(), groups = {};
  for (const [day, arr] of Object.entries(m.shifts || {})) for (const e of arr) {
    const k = day + '|' + shiftOf(e);
    if (k === cs.date + '|' + cs.type) continue;
    groups[k] = (groups[k] || 0) + num(e.count);
  }
  const vals = Object.values(groups).filter(v => v > 0);
  return vals.length ? { avg: vals.reduce((a, b) => a + b, 0) / vals.length, n: vals.length } : null;
}
function forecastHtml(m) {
  const qty = num(m.part.qty), left = Math.max(0, qty - doneOf(m));
  const cyc = num(m.cycle), eff = Math.min(100, Math.max(1, num(m.eff) || 85)) / 100;
  const head = '<div class="section-title">⏱ Прогноз по партии</div>';
  if (!(cyc > 0)) return `<div class="ui-card">${head}<div class="muted">${isAdmin()
    ? 'Укажите «Время цикла на 1 деталь» в «Наладке станка», и здесь появится расчёт смен и срока окончания.'
    : 'Время цикла пока не задано наладчиком.'}</div></div>`;
  const perHour = 3600 / cyc * eff, perShift = perHour * SHIFT_HOURS;
  const fact = factPerShift(m);
  const line = (a, b) => `<div class="result-line"><span>${a}</span><b>${b}</b></div>`;
  let main;
  if (qty > 0 && left === 0) main = '<div class="result-big">✅ Партия выполнена</div>';
  else if (qty <= 0) main = '<div class="muted">Укажите размер партии в «Наладке станка».</div>';
  else {
    const hours = left / perHour;
    const finish = new Date(Date.now() + hours * 3600 * 1000);
    main = `<div class="muted">До конца партии (осталось ${fmtNum(left, 0)} шт)</div>
      <div class="result-big">≈ ${fmtDur(hours)}</div>
      ${line('Это смен по ' + SHIFT_HOURS + ' ч', '≈ ' + fmtNum(hours / SHIFT_HOURS, 1))}
      ${line('Окончание примерно', fmtDT(finish.toISOString()))}`;
    if (fact) {
      const fh = left / (fact.avg / SHIFT_HOURS);
      main += line('По факту (' + fmtNum(fact.avg, 0) + ' шт/смену)', '≈ ' + fmtDur(fh));
    }
  }
  return `<div class="ui-card">${head}<div class="result-box" style="margin-top:0">${main}
    <div style="border-top:1px solid #F2CDAE;margin:8px 0 4px"></div>
    ${line('Цикл на деталь', fmtNum(cyc) + ' сек · загрузка ' + fmtNum(eff * 100, 0) + '%')}
    ${line('Деталей в час', '≈ ' + fmtNum(perHour, 0))}
    ${line('☀️ День (' + hh(DAY_START) + '–' + hh(NIGHT_START) + ')', '≈ ' + fmtNum(perShift, 0) + ' шт')}
    ${line('🌙 Ночь (' + hh(NIGHT_START) + '–' + hh(DAY_START) + ')', '≈ ' + fmtNum(perShift, 0) + ' шт')}
    ${line('За сутки', '≈ ' + fmtNum(perShift * 2, 0) + ' шт')}
    ${fact ? line('Факт: в среднем за смену', fmtNum(fact.avg, 0) + ' шт (' + fact.n + ' смен)') : ''}
  </div>
  <div class="muted mt">Расчётное время, при работе станка в обе смены без остановок, кроме учтённой загрузки.</div></div>`;
}

function viewCalendar() {
  const m = curM();
  const y = ui.month.getFullYear(), mo = ui.month.getMonth();
  const first = new Date(y, mo, 1), days = new Date(y, mo + 1, 0).getDate();
  const startDow = (first.getDay() + 6) % 7;
  const todayIso = isoDate(new Date());
  let cells = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].map(d => `<div class="cal-dow">${d}</div>`).join('');
  for (let i = 0; i < startDow; i++) cells += '<div class="cal-day empty-cell"></div>';
  let monthTotal = 0; const byPerson = {};
  for (let d = 1; d <= days; d++) {
    const iso = y + '-' + pad(mo + 1) + '-' + pad(d);
    const arr = m.shifts[iso] || [];
    let sd = 0, sn = 0;
    arr.forEach(e => {
      const c = num(e.count), k = e.who || '—';
      const p = byPerson[k] || (byPerson[k] = { d: 0, n: 0 });
      if (shiftOf(e) === 'night') { sn += c; p.n += c; } else { sd += c; p.d += c; }
    });
    monthTotal += sd + sn;
    const hasD = arr.some(e => shiftOf(e) === 'day'), hasN = arr.some(e => shiftOf(e) === 'night');
    const marks = (hasD ? `<small>☀️${sd}</small>` : '') + (hasN ? `<small>🌙${sn}</small>` : '');
    cells += `<div class="cal-day ${arr.length ? 'has' : ''} ${iso === todayIso ? 'today' : ''}" data-act="calDay" data-d="${iso}">${d}${marks}</div>`;
  }
  const monthName = ui.month.toLocaleString('ru-RU', { month: 'long', year: 'numeric' });
  const persons = Object.entries(byPerson).sort((a, b) => (b[1].d + b[1].n) - (a[1].d + a[1].n)).map(([w, c]) =>
    `<div class="shift-row"><span>👤 ${esc(w)}<div class="muted">☀️ ${fmtNum(c.d, 0)} · 🌙 ${fmtNum(c.n, 0)}</div></span><b>${fmtNum(c.d + c.n, 0)} шт</b></div>`).join('');
  return header('Календарь смен', 'Станок №' + m.num, true) +
    `<div class="ui-card">
      <div class="cal-head"><button class="mini-btn" data-act="calPrev">←</button><b>${esc(monthName)}</b><button class="mini-btn" data-act="calNext">→</button></div>
      <div class="cal-grid">${cells}</div>
      <div class="muted mt">Нажмите на день, чтобы отметить, кто работал и сколько сделал.<br>☀️ день ${hh(DAY_START)}–${hh(NIGHT_START)} · 🌙 ночь ${hh(NIGHT_START)}–${hh(DAY_START)} (записывается на дату начала смены).</div>
    </div>
    <div class="ui-card"><div class="section-title">Итого за месяц: ${fmtNum(monthTotal, 0)} шт</div>${persons || '<div class="empty">Нет записей</div>'}</div>`;
}

function viewDay() {
  const m = curM(), d = ui.day, arr = m.shifts[d] || [];
  const [yy, mm, dd] = d.split('-');
  const total = arr.reduce((s, e) => s + num(e.count), 0);
  const block = type => {
    const list = arr.filter(e => shiftOf(e) === type);
    const sum = list.reduce((s, e) => s + num(e.count), 0);
    const rows = list.map(e => `<div class="shift-row"><span>👤 ${esc(e.who || '—')}: <b>${fmtNum(num(e.count), 0)} шт</b></span>
      <div class="row-actions">${isAdmin() || e.who === user ? `<button class="mini-btn" data-act="shiftEdit" data-id="${e.id}">✎</button>` : ''}</div></div>`).join('');
    const hours = type === 'day' ? `${hh(DAY_START)}–${hh(NIGHT_START)}` : `${hh(NIGHT_START)}–${hh(DAY_START)} (до утра следующего дня)`;
    return `<div class="ui-card"><div class="section-title">${SHIFT_NAMES[type]} · ${fmtNum(sum, 0)} шт</div>
      <div class="muted" style="margin:-6px 0 10px">${hours}</div>
      ${rows || '<div class="empty">Записей нет</div>'}
      <button class="action-button secondary" data-act="shiftAdd" data-s="${type}">+ Отметить человека</button></div>`;
  };
  return header(`${dd}.${mm}.${yy}`, `Всего за сутки: ${fmtNum(total, 0)} шт · станок №${m.num}`, true) + block('day') + block('night');
}

/* Блок результата расчёта. Отдельная функция, чтобы его можно было
   перерисовывать на лету при вводе, не трогая поля ввода (иначе пропадёт курсор). */
function barResultHtml(m) {
  const c = m.barCfg;
  const qty = num(m.part.qty), len = num(m.part.len);
  const perPart = len + num(m.cutW) + num(c.face);
  const remnant = num(c.remnant);
  const usable = num(c.barLen) * 1000 - remnant;      // полезная длина одного прутка
  const ok = usable > 0;
  /* Огарок теряется на каждом прутке, поэтому общая потребность =
     длина деталей + огарки (по числу прутков, расчётное число без округления). */
  const calc = parts => {
    const exact = ok ? parts / usable : 0;
    return { parts, rem: exact * remnant, all: parts + exact * remnant, bars: Math.ceil(exact - 1e-9) };
  };
  const done = doneOf(m);
  const left = Math.max(0, qty - done);
  const all = calc(qty * perPart), rest = calc(left * perPart);
  const warn = !ok ? '<div class="muted" style="color:#C0392B;margin-top:6px">⚠️ Остаток-огарок больше длины прутка, проверьте значения.</div>' : '';
  const line = (a, b) => `<div class="result-line"><span>${a}</span><b>${b}</b></div>`;
  return `<div class="muted">Нужно прутка до конца партии (с огарками)</div>
    <div class="result-big">${fmtNum(rest.all / 1000)} м</div>
    ${line('Осталось сделать', fmtNum(left, 0) + ' шт из ' + fmtNum(qty, 0))}
    ${line('Прутков целиком (по ' + fmtNum(num(c.barLen)) + ' м)', rest.bars + ' шт')}
    <div style="border-top:1px solid #F2CDAE;margin:8px 0 4px"></div>
    ${line('Всего на партию (с огарками)', fmtNum(all.all / 1000) + ' м (' + all.bars + ' шт)')}
    ${line('Расход на 1 деталь', fmtNum(perPart) + ' мм')}
    ${line('Детали на всю партию (без огарков)', fmtNum(all.parts / 1000) + ' м')}
    ${line('Огарки на всю партию (' + fmtNum(remnant, 0) + ' мм × прутки)', fmtNum(all.rem / 1000) + ' м')}${warn}`;
}

/* Пересчёт «на лету» при вводе в поля калькулятора */
const BAR_FIELDS = { 'b-cut': m => m, 'b-face': m => m.barCfg, 'b-len': m => m.barCfg, 'b-rem': m => m.barCfg };
const BAR_KEYS = { 'b-cut': 'cutW', 'b-face': 'face', 'b-len': 'barLen', 'b-rem': 'remnant' };
let barSaveTimer = null;
function barLiveUpdate(t) {
  const m = curM();
  if (!m || !isAdmin()) return;
  BAR_FIELDS[t.id](m)[BAR_KEYS[t.id]] = num(t.value);
  const box = document.getElementById('bar-result');
  if (box) box.innerHTML = barResultHtml(m);
  clearTimeout(barSaveTimer);
  barSaveTimer = setTimeout(save, 700);      // сохраняем, когда человек на секунду остановился
}

const views = { list: viewList, machine: viewMachine, tools: viewTools, changes: viewChanges, program: viewProgram, drawing: viewDrawing, calendar: viewCalendar, day: viewDay, bar: viewBar };
function render() {
  document.getElementById('app').innerHTML = viewHtml();
  window.scrollTo(0, 0);
}
function rerender() { const y = window.scrollY; document.getElementById('app').innerHTML = viewHtml(); window.scrollTo(0, y); }

/* ===================== ДЕЙСТВИЯ ===================== */
function machineFields(m) {
  return [
    { k: 'num', label: 'Номер станка', value: m.num },
    { k: 'model', label: 'Модель', value: m.model, ph: 'Citizen L20, Star SR-20...' },
    { k: 'partName', label: 'Деталь', value: m.part.name },
    { k: 'len', label: 'Длина детали (мм)', type: 'number', value: m.part.len },
    { k: 'qty', label: 'Партия (шт)', type: 'number', value: m.part.qty },
    { k: 'dia', label: 'Пруток Ø (мм)', type: 'number', value: m.bar.dia },
    { k: 'cm', label: 'Цанга Main', value: m.collets.main },
    { k: 'cb', label: 'Цанга Back', value: m.collets.back },
    { k: 'cutW', label: 'Ширина отрезного (мм)', type: 'number', value: m.cutW },
    { k: 'cycle', label: 'Время цикла на 1 деталь (сек)', type: 'number', value: m.cycle || '', ph: 'например 24,5' },
    { k: 'eff', label: 'Загрузка станка, % (простои, смена прутка, наладка)', type: 'number', value: m.eff || 85 }
  ];
}
function applyMachine(m, o) {
  m.num = o.num || m.num; m.model = o.model;
  m.part = { name: o.partName, len: num(o.len), qty: num(o.qty) };
  m.bar.dia = num(o.dia);
  m.collets = { main: o.cm, back: o.cb };
  m.cutW = num(o.cutW);
  m.cycle = Math.max(0, num(o.cycle));
  m.eff = Math.min(100, Math.max(1, num(o.eff) || 85));
}

const REASONS = ['Износ', 'Поломка', 'Смена партии', 'Профилактика', 'Другое'];

const Actions = {
  open(d) { ui.mid = d.id; ui.view = 'machine'; render(); },
  back() {
    if (ui.tab === 'threads') return thrBack();
    if (ui.view === 'machine') ui.view = 'list';
    else if (ui.view === 'day') ui.view = 'calendar';
    else ui.view = 'machine';
    render();
  },
  go(d) { ui.view = d.v; render(); },
  setName() {
    modal('Профиль · ' + (isAdmin() ? 'Администратор' : 'Оператор'), [{ k: 'name', label: 'Фамилия Имя', value: user }], o => {
      if (!o.name) return false;
      user = o.name; localStorage.setItem('sc_user', user); render();
    });
  },
  addMachine() {
    const m = newMachine(pad(db.machines.length + 1), '');
    modal('Новый станок', machineFields(m), o => {
      applyMachine(m, o); db.machines.push(m); save(); render();
    });
  },
  editMachine() {
    const m = curM();
    modal('Наладка станка', machineFields(m), o => { applyMachine(m, o); save(); render(); },
      () => { db.machines = db.machines.filter(x => x.id !== m.id); save(); ui.view = 'list'; render(); });
  },
  adj(d) {
    if (!user) return Actions.setName();
    const m = curM(), e = todayEntry(m, true);
    e.count = Math.max(0, num(e.count) + num(d.n));
    save(); rerender();
  },

  /* инструменты */
  toolAdd() {
    const m = curM();
    modal('Новый инструмент', [
      { k: 'code', label: 'Позиция (T01...)', value: 'T' + pad(m.tools.length + 1) },
      { k: 'name', label: 'Название', value: '' },
      { k: 'spec', label: 'Пластина / размер', value: '' }
    ], o => { m.tools.push({ id: uid(), code: o.code, name: o.name, spec: o.spec }); save(); rerender(); });
  },
  toolEdit(d) {
    const m = curM(), t = m.tools.find(x => x.id === d.id);
    modal('Инструмент', [
      { k: 'code', label: 'Позиция', value: t.code },
      { k: 'name', label: 'Название', value: t.name },
      { k: 'spec', label: 'Пластина / размер', value: t.spec }
    ], o => { Object.assign(t, o); save(); rerender(); },
      () => { m.tools = m.tools.filter(x => x.id !== t.id); save(); rerender(); });
  },
  toolChange(d) {
    if (!user) return Actions.setName();
    const m = curM(), t = m.tools.find(x => x.id === d.id);
    modal('Замена: ' + t.code + ' ' + t.name, [
      { k: 'reason', label: 'Причина', type: 'select', options: REASONS, value: 'Износ' },
      { k: 'spec', label: 'Что установлено (пластина / размер)', value: t.spec },
      { k: 'comment', label: 'Комментарий', value: '' }
    ], o => {
      m.changes.push({ id: uid(), ts: new Date().toISOString(), who: user, code: t.code, tool: t.name, reason: o.reason, spec: o.spec, comment: o.comment });
      t.spec = o.spec || t.spec;
      save(); rerender();
    });
  },

  /* программа */
  progEdit() {
    const m = curM(), p = m.program;
    modal('Программа', [
      { k: 'name', label: 'Номер / название (O1234)', value: p.name },
      { k: 'notes', label: 'Заметки', type: 'textarea', rows: 3, value: p.notes },
      { k: 'code', label: 'Текст программы (необязательно)', type: 'textarea', rows: 8, value: p.code }
    ], o => { m.program = o; save(); rerender(); });
  },

  /* чертёж */
  drawPick() {
    const inp = document.getElementById('drawfile');
    inp.onchange = () => {
      const f = inp.files[0]; if (!f) return;
      const img = new Image(), url = URL.createObjectURL(f);
      img.onload = () => {
        const max = 1400, k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const m = curM();
        m.drawing = c.toDataURL('image/jpeg', 0.75); m.hasDrawing = true; m.drawingV = Date.now();
        URL.revokeObjectURL(url); save(); rerender();
        Sync.putDrawing(m.id, m.drawing);
      };
      img.src = url;
    };
    inp.click();
  },
  drawView() {
    const w = document.createElement('div');
    w.className = 'fullscreen';
    w.innerHTML = `<img src="${curM().drawing}">`;
    w.onclick = () => w.remove();
    document.body.appendChild(w);
  },
  drawDel() {
    if (!confirm('Удалить чертёж?')) return;
    const m = curM();
    m.drawing = null; m.hasDrawing = false; m.drawingV = Date.now();
    save(); rerender(); Sync.delDrawing(m.id);
  },
  syncRetry() { Sync.error = null; render(); Sync.boot(); },

  /* календарь */
  calPrev() { ui.month = new Date(ui.month.getFullYear(), ui.month.getMonth() - 1, 1); rerender(); },
  calNext() { ui.month = new Date(ui.month.getFullYear(), ui.month.getMonth() + 1, 1); rerender(); },
  calDay(d) { ui.day = d.d; ui.view = 'day'; render(); },
  shiftAdd(d) {
    const m = curM();
    modal('Кто работал', [
      { k: 'shift', label: 'Смена', type: 'select', options: [SHIFT_NAMES.day, SHIFT_NAMES.night], value: SHIFT_NAMES[d.s || 'day'] },
      ...(isAdmin() ? [{ k: 'who', label: 'Фамилия Имя', value: user }] : []),
      { k: 'count', label: 'Сделано деталей (шт)', type: 'number', value: '' }
    ], o => {
      const who = isAdmin() ? o.who : user;
      if (!who) { alert('Укажите своё имя (нажмите на бейдж вверху).'); return false; }
      const type = o.shift === SHIFT_NAMES.night ? 'night' : 'day';
      (m.shifts[ui.day] = m.shifts[ui.day] || []).push({ id: uid(), who, shift: type, count: num(o.count) });
      save(); rerender();
    });
  },
  shiftEdit(d) {
    const m = curM(), arr = m.shifts[ui.day], e = arr.find(x => x.id === d.id);
    modal('Запись смены', [
      { k: 'shift', label: 'Смена', type: 'select', options: [SHIFT_NAMES.day, SHIFT_NAMES.night], value: SHIFT_NAMES[shiftOf(e)] },
      ...(isAdmin() ? [{ k: 'who', label: 'Фамилия Имя', value: e.who }] : []),
      { k: 'count', label: 'Сделано деталей (шт)', type: 'number', value: e.count }
    ], o => { if (isAdmin()) e.who = o.who; e.shift = o.shift === SHIFT_NAMES.night ? 'night' : 'day'; e.count = num(o.count); save(); rerender(); },
      () => { m.shifts[ui.day] = arr.filter(x => x.id !== e.id); if (!m.shifts[ui.day].length) delete m.shifts[ui.day]; save(); rerender(); });
  }
};

  if (!el || !Actions[el.dataset.act]) return;

  Actions[el.dataset.act](el.dataset);
});

/* ручной ввод счётчика и параметров расчёта прутка */
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'mycount') {
    if (!user) { Actions.setName(); return; }
    const e2 = todayEntry(curM(), true);
    e2.count = Math.max(0, Math.round(num(t.value)));
    save(); rerender();
  } else if (BAR_FIELDS[t.id]) {              // ушли из поля калькулятора — сохраняем сразу
    if (!isAdmin()) return;
    barLiveUpdate(t);
    clearTimeout(barSaveTimer);
    save();
  }
});

  if (BAR_FIELDS[e.target.id]) barLiveUpdate(e.target);
});

    });
    return o;
  };
  // Таблица 3: Td наружного диаметра наружной резьбы, степени 4, 6, 8
  const TD = parseRows(`
    0.2:36,56,-
    0.25:42,67,-
    0.3:48,75,-
    0.35:53,85,-
    0.4:60,95,-
    0.45:63,100,-
    0.5:67,106,-
    0.6:80,125,-
    0.7:90,140,-
    0.75:90,140,-
    0.8:95,150,236
    1:112,180,280
    1.25:132,212,335
    1.5:150,236,375
    1.75:170,265,425
    2:180,280,450

/* ---------- форматирование ---------- */
const f3 = v => { let r = Math.round(v * 1000 + (v >= 0 ? 1e-6 : -1e-6)) / 1000; if (Object.is(r, -0)) r = 0; return String(+r.toFixed(3)); };
const fDev = v => { const r = +f3(v); return r === 0 ? '0' : (r > 0 ? '+' : '') + r; };
const fP = v => String(+(+v).toFixed(3));
const thrName = (d, P, cls) => `M${fP(d)} x ${fP(P)}${cls ? ' - ' + cls : ''}`;
const withDot = v => { const s = String(v).trim().replace(',', '.'); return s === '' ? '' : (s.includes('.') ? s : s + '.0'); };

/* ---------- шаблон G76 (Fanuc, двухблочный формат) ---------- */
const G76_DEFAULT = { m: 3, r: 0, a: 60, qmin: 50, rf: 0.02, q1: 180, xd: 2 };
function g76Tpl() {
  let t = {};
  try { t = JSON.parse(localStorage.getItem('sc_g76') || '{}') || {}; } catch (e) {}
  return Object.assign({}, G76_DEFAULT, t);
}
function g76Save(t) { try { localStorage.setItem('sc_g76', JSON.stringify(t)); } catch (e) {} }
function g76Code(res, z) {
  const t = g76Tpl();
  const ext = res.kind === 'ext';
  const X = ext ? res.d - 1.2268693210 * res.P : res.d;          // наружная: d3 номинальный; внутренняя: D (дно резьбы)
  const h = Math.round(res.depth * 1000);                           // высота профиля, мкм
  const cap = Math.max(10, Math.round(h / 3 / 10) * 10);           // первый проход не больше 1/3 высоты профиля
  const q = Math.min(Math.round(num(t.q1)), cap);
  const p2 = n => String(Math.max(0, Math.min(99, Math.round(num(n))))).padStart(2, '0');
  const line1 = `G76P${p2(t.m)}${p2(t.r)}${p2(t.a)}Q${Math.round(num(t.qmin))}R${withDot(fP(num(t.rf)))};`;
  const line2 = `G76X${X.toFixed(Math.max(0, Math.min(3, Math.round(num(t.xd)))))}Z${withDot(z)}P${h}Q${q}F${withDot(fP(res.P))};`;
  return { text: line1 + '\n' + line2, X, h, q, qCapped: q < Math.round(num(t.q1)), t };
}

      <div class="dim-head"><span class="dim-name">${r.name}</span><span class="dim-nom">${f3(r.nom)}</span>
        <span class="dim-dev">${devs.map(fDev).join('<br>')}</span></div>
      <div class="dim-grid"><div><small>мин</small>${f3(r.min)}</div><div><small>сред.</small>${f3((r.min + r.max) / 2)}</div><div><small>макс</small>${f3(r.max)}</div></div>
      ${r.note ? `<div class="dim-note">${r.note}</div>` : ''}
    </div>`;
  };
  return thrHeader('Информация о резьбе', thrName(s.d, s.P, s.cls)) +
    `<div class="ui-card">
      <div class="thr-title">${thrName(s.d, s.P, s.cls)}</div>
      <div class="thr-sub">M - Метрическая цилиндрическая ${ext ? 'наружная' : 'внутренняя'} резьба<br>${THR.pitchType(s.d, s.P)}</div>
      ${kv('Тип резьбы', KIND_NAME[s.kind])}
      ${kv('Диаметр (номинальный)', fP(s.d))}
      ${kv('Шаг', fP(s.P))}
      ${kv('Глубина резьбы', f3(res.depth))}
      ${kv('Класс допуска', s.cls)}
      ${kv('Тип шага', THR.pitchType(s.d, s.P))}
    </div>
    <div class="ui-card">${res.rows.map(dimRow).join('')}</div>
    ${g76Card(res)}
    <div class="ui-card">
      <div class="section-title">Профиль резьбы</div>
      ${kv('H - Высота исходного треугольника', f3(res.H))}
      ${kv('H1 - Рабочая высота профиля (5/8 H)', f3(0.5412658774 * s.P))}
      ${kv(ext ? 'h3 - Высота профиля болта' : 'Глубина резьбы гайки', f3(res.depth))}
      ${kv('R - Радиус впадины, не менее (0,125P)', f3(0.125 * s.P))}
      ${kv(ext ? 'es - Основное отклонение, мкм' : 'EI - Основное отклонение, мкм', ext ? res.es : res.EI)}
      ${ext ? kv('Td / Td2, мкм', res.Td + ' / ' + res.Td2) : kv('TD1 / TD2, мкм', res.TD1 + ' / ' + res.TD2)}
      <div class="muted mt">Допуски — ГОСТ 16093-2004 (ИСО 965-1), размеры — ГОСТ 24705-2004.</div>
    </div>`;
}

function g76Card(res) {
  const s = ui.thr, g = g76Code(res, s.z), t = g.t;
  const inp = (id, label, val) => `<div class="input-group"><label>${label}</label><input type="text" inputmode="decimal" id="${id}" value="${esc(val)}"></div>`;
  return `<div class="ui-card">
    <div class="section-title">Код G76 (Fanuc)</div>
    ${inp('g76-z', 'Z — конец резьбы (впишите сами, можно оставить пустым)', s.z)}
    <pre class="gcode" id="g76-code">${esc(g.text)}</pre>
    <button class="action-button" data-act="g76Copy" id="g76-copy">Скопировать код</button>
    <div class="g76-info" id="g76-info">${g76Info(res, g)}</div>
    <button class="action-button secondary mt" data-act="g76Tpl">${s.tpl ? 'Скрыть шаблон' : '⚙️ Шаблон G76 (P, Q, R первой строки)'}</button>
    ${s.tpl ? `<div class="mt">
      <div class="two-col">${inp('g76-m', 'Чистовых проходов (m)', t.m)}${inp('g76-r', 'Сбег/фаска (r, ×0,1 шага)', t.r)}</div>
      <div class="two-col">${inp('g76-a', 'Угол профиля (a)', t.a)}${inp('g76-qmin', 'Мин. съём Q, мкм', t.qmin)}</div>
      <div class="two-col">${inp('g76-rf', 'Чистовой припуск R, мм', t.rf)}${inp('g76-q1', 'Первый проход Q, мкм', t.q1)}</div>
      ${inp('g76-xd', 'Знаков после запятой в X', t.xd)}
      <button class="action-button secondary" data-act="g76Reset">Вернуть шаблон по умолчанию</button>
      <div class="muted mt">Шаблон сохраняется на этом телефоне и применяется ко всем резьбам.</div>
    </div>` : ''}
  </div>`;
}
function g76Info(res, g) {
  const ext = res.kind === 'ext';
  return `<div class="kv"><span>X — ${ext ? 'диаметр по впадине d3 (номинал)' : 'диаметр по дну резьбы D (номинал)'}</span><b>${g.X.toFixed(3)}</b></div>
    <div class="kv"><span>P — высота профиля, мкм (${ext ? '0,6134' : '0,5413'}·шаг)</span><b>${g.h}</b></div>
    <div class="kv"><span>Q — первый проход, мкм${g.qCapped ? ' (ограничен 1/3 высоты)' : ''}</span><b>${g.q}</b></div>
    <div class="kv"><span>F — шаг</span><b>${fP(res.P)}</b></div>`;
}
function g76Refresh() {
  const s = ui.thr, res = THR.calc(s.kind, s.d, s.P, s.cls);
  if (res.error) return;
  const g = g76Code(res, s.z);
  const code = document.getElementById('g76-code'), info = document.getElementById('g76-info');
  if (code) code.textContent = g.text;
  if (info) info.innerHTML = g76Info(res, g);
}

function viewStub(title, sub, text) {
  return header(title, sub, false) + `<div class="ui-card"><div class="empty" style="padding:30px 10px">🛠 ${text}</div></div>`;
}

const TABS = [
  { k: 'machines', ico: '🏭', t: 'Станки' },
  { k: 'schedule', ico: '📅', t: 'График' },
  { k: 'tol', ico: '📏', t: 'Допуски' },
  { k: 'threads', ico: '🔩', t: 'Резьбы' }
];
const navHtml = () => `<nav class="tabbar"><div class="tabbar-in">${TABS.map(x =>
  `<div class="tab ${ui.tab === x.k ? 'active' : ''}" data-act="tab" data-t="${x.k}"><span class="ico">${x.ico}</span>${x.t}</div>`).join('')}</div></nav>`;

function tabHtml() {
  if (ui.tab === 'threads') return viewThreads();
  if (ui.tab === 'schedule') return viewStub('График', 'Планирование работы', 'Раздел «График» в разработке — сделаем отдельным этапом.');
  if (ui.tab === 'tol') return viewStub('Допуски', 'Квалитеты H, h, ГОСТ 25346/25347', 'Таблица допусков по квалитетам (H12, H14 и т.д.) в разработке — следующий этап.');
  return gateView() || views[ui.view]();
}

const THR_ORDER = ['type', 'dia', 'pitch', 'class', 'info'];
function thrBack() {
  const i = THR_ORDER.indexOf(ui.thr.step);
  ui.thr.step = THR_ORDER[Math.max(0, i - 1)];
  render();
}

function copyText(text, btn) {
  const done = () => { if (btn) { const o = btn.textContent; btn.textContent = '✅ Скопировано'; setTimeout(() => { btn.textContent = o; }, 1500); } };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { alert(text); }
    ta.remove();
  };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
}

Object.assign(Actions, {
  tab(d) { ui.tab = d.t; render(); },
  thrKind(d) { ui.thr.kind = d.k; ui.thr.step = 'dia'; render(); },
  thrDia(d) { ui.thr.d = +d.d; ui.thr.step = 'pitch'; render(); },
  thrCustom() {
    modal('Свой диаметр', [{ k: 'd', label: 'Номинальный диаметр, мм (1–90)', type: 'number', value: '' }], o => {
      const v = num(o.d);
      if (!(v >= 1 && v <= 90)) { alert('Диаметр должен быть от 1 до 90 мм'); return false; }
      ui.thr.d = v; ui.thr.step = 'pitch'; render();
    });
  },
  thrPitch(d) { ui.thr.P = +d.p; ui.thr.step = 'class'; render(); },
  thrCls(d) { ui.thr.cls = d.c; ui.thr.step = 'info'; render(); },
  g76Copy(d) {
    const s = ui.thr, res = THR.calc(s.kind, s.d, s.P, s.cls);
    if (!res.error) copyText(g76Code(res, s.z).text, document.getElementById('g76-copy'));
  },
  g76Tpl() { ui.thr.tpl = !ui.thr.tpl; rerender(); },
  g76Reset() { g76Save({}); rerender(); }
});

const G76_KEYS = { 'g76-m': 'm', 'g76-r': 'r', 'g76-a': 'a', 'g76-qmin': 'qmin', 'g76-rf': 'rf', 'g76-q1': 'q1', 'g76-xd': 'xd' };
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'g76-z') { ui.thr.z = e.target.value; g76Refresh(); }
  else if (G76_KEYS[id]) {
    const t = g76Tpl(); t[G76_KEYS[id]] = e.target.value; g76Save(t); g76Refresh();
  }
});

/* ===================== СТАРТ ===================== */
render();
if (!user) setTimeout(() => Actions.setName(), 300);
if (Sync.enabled) Sync.boot();
</script>
</body>
</html>
